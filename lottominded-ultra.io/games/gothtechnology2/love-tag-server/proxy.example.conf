# Adapt server_name and certificate paths to an authorized staging host.
# nginx must terminate TLS; persistent WebSocket hosting is required.
location / {
    proxy_pass http://127.0.0.1:8211;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
# Restrict /ops/metrics to the operations network as well as the bearer token.
