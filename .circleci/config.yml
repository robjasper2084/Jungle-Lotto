version: 2.1

jobs:
  validate-site:
    docker:
      - image: cimg/node:22.14-browsers
    resource_class: medium
    working_directory: ~/project/lottominded-ultra.io
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - v1-npm-node22-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts
      - save_cache:
          key: v1-npm-node22-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - restore_cache:
          keys:
            - v1-playwright-1.61.1-chromium
      - run:
          name: Install Chromium
          command: npx playwright install chromium
      - save_cache:
          key: v1-playwright-1.61.1-chromium
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: Validate static routes and assets
          command: npm run check:site
      - run:
          name: Run browser tests
          command: npm test
      - store_test_results:
          path: test-results/playwright
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results/artifacts
          destination: test-artifacts

workflows:
  validate:
    jobs:
      - validate-site
