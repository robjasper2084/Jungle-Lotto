name: Belle Isle existing opaque draw order diagnostic

on:
  push:
    branches: ['upgrade-redesign-surface-fragments-*']
  pull_request:
    paths:
      - '.github/workflows/belle-opaque-order-proof.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/opaque-order-*'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/opaqueSurfaceOrder*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-opaque-order-proof-${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
  cancel-in-progress: true

env:
  OPAQUE_ORDER_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  OPAQUE_ORDER_PROOF_BASELINE_SHA: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c

jobs:
  original-world-diagnostic:
    name: Opaque order, exact pixels and native timing (${{ matrix.os }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            partition: linux-a
          - os: ubuntu-latest
            partition: linux-b
          - os: macos-15
            partition: all
    env:
      OPAQUE_ORDER_PROOF_PARTITION: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OPAQUE_ORDER_PROOF_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.github/workflows/belle-opaque-order-proof.yml
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact source and fetch the immutable full-world baseline
        run: |
          test "$(git rev-parse HEAD)" = "$OPAQUE_ORDER_PROOF_SOURCE_SHA"
          git fetch --filter=blob:none --no-tags --depth=1 origin "$OPAQUE_ORDER_PROOF_BASELINE_SHA"
      - name: Install locked browser and game dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chrome
          cd belle-isle-source/game
          npm ci
      - name: Verify the disabled controller and independent proof validator
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          node --test src/belle/opaqueSurfaceOrder.test.ts
          node scripts/opaque-order-native-proof.mjs --self-test
      - name: Compare fixed full-world pixels and collect balanced native samples
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: node scripts/opaque-order-native-proof.mjs
      - name: Preserve every candidate result, source receipt, shader, pixel and raw sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-opaque-order-${{ matrix.os }}-${{ matrix.partition }}-${{ env.OPAQUE_ORDER_PROOF_SOURCE_SHA }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/opaque-order-proof/
          if-no-files-found: error
          retention-days: 14

  complete-fixed-partitions:
    name: Require the complete native and software case union
    if: always()
    needs: original-world-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OPAQUE_ORDER_PROOF_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/belle-opaque-order-proof.yml
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/opaque-order-*
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/opaqueSurfaceOrder*
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: belle-opaque-order-*-${{ env.OPAQUE_ORDER_PROOF_SOURCE_SHA }}
          path: opaque-order-artifacts
          merge-multiple: false
      - name: Require all eight cases on each backend at the same exact source
        run: node lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/opaque-order-native-proof.mjs --verify-partitions opaque-order-artifacts
