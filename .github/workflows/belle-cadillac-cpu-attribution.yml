name: Cadillac Chrome CPU attribution (diagnostic only)
on:
  pull_request:
    branches: [upgrade-redesign-cadillac-modification-suite]
    paths:
      - '.github/workflows/belle-cadillac-cpu-attribution.yml'
      - '.github/diagnostics/belle-cpu-observer.mjs'
permissions:
  contents: read
  actions: read
jobs:
  cpu-attribution:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96603a2346364262324569bb5839a07cea3a3eaa
          path: app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/diagnostics/belle-cpu-observer.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          run-id: 45559755128
          github-token: ${{ github.token }}
          name: game-B
          path: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist
      - uses: actions/download-artifact@v4
        with:
          run-id: 45559755128
          github-token: ${{ github.token }}
          name: receipt-B
          path: evidence/receipt-B
      - name: Verify immutable previous build and derive separate diagnostic driver
        run: |
          set -euo pipefail
          game="$GITHUB_WORKSPACE/app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game"
          receipt="$GITHUB_WORKSPACE/evidence/receipt-B"
          helper="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/belle-cpu-observer.mjs"
          test "$(git -C app rev-parse HEAD)" = 96603a2346364262324569bb5839a07cea3a3eaa
          test "$(git -C app rev-parse 'HEAD^{tree}')" = 22b3c7cacd9d9af684489519895c3f260d16efca
          test "$(cat "$receipt/source.txt")" = "$(git -C app rev-parse HEAD)"
          test "$(cat "$receipt/tree.txt")" = "$(git -C app rev-parse 'HEAD^{tree}')"
          test "$(cat "$receipt/driver.txt")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          test "$(git hash-object "$game/scripts/sustained-ride-profile.mjs")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          test "$(git hash-object "$helper")" = 007ef71a678d52e103492d5c4ecf74f38c3150af
          (cd "$game/dist" && shasum -a 256 -c "$receipt/dist.sha256") > evidence/pre-build-integrity.txt
          test "$(find "$game/dist" -type f | wc -l | tr -d ' ')" = "$(wc -l < "$receipt/dist.sha256" | tr -d ' ')"
          test "$(wc -l < "$receipt/dist.sha256" | tr -d ' ')" = 195
          (cd "$game/../.." && npm ci && npx playwright install chrome)
          node --check "$helper"
          node "$helper" "$game/scripts/sustained-ride-profile.mjs"
          node --check "$game/scripts/sustained-ride-cpu-diagnostic.mjs"
          node --check "$game/scripts/belle-cpu-observer.mjs"
          test "$(git hash-object "$game/scripts/belle-cpu-observer.mjs")" = "$(git hash-object "$helper")"
          git -C app diff --exit-code
          git -C diagnostic rev-parse HEAD > evidence/diagnostic-head.txt
          shasum -a 256 "$game/scripts/sustained-ride-profile.mjs" "$game/scripts/sustained-ride-cpu-diagnostic.mjs" "$helper" > evidence/driver-sha256.txt
          cp "$game/scripts/sustained-ride-cpu-diagnostic.mjs" evidence/derived-driver.mjs
          cp "$helper" evidence/observer.mjs
          { date -u; sw_vers; uname -m; sysctl hw.model hw.ncpu hw.memsize; node -v; "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version; uptime; vm_stat; } > evidence/host-before.txt
          printf 'CPU attribution only; derived observer adds sampling overhead; no release acceptance. Original application 96603a and original 195-file ABBA B build; original script remains unchanged.\n' > evidence/scope.txt
      - name: Profile real Chrome renderer and native GPU-process CPU during original full 90-second High ride
        timeout-minutes: 28
        working-directory: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/evidence"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = 96603a2346364262324569bb5839a07cea3a3eaa
          test ! -e output/sustained-profile/full/desktop
          status=0
          node scripts/sustained-ride-cpu-diagnostic.mjs > "$target/profiled-driver.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$target/profiled-driver-exit.txt"
          cat "$target/profiled-driver.log"
          { date -u; uptime; vm_stat; } > "$target/host-after.txt"
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          (cd dist && shasum -a 256 -c "$target/receipt-B/dist.sha256") > "$target/post-build-integrity.txt"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "$(wc -l < "$target/receipt-B/dist.sha256" | tr -d ' ')"
          git diff --exit-code
          report=output/sustained-profile/full/desktop
          test -s "$report/report.json"
          test -s "$report/renderer.cpuprofile"
          test -s "$report/renderer-profile-summary.json"
          test -s "$report/cpu-diagnostic.json"
          node --input-type=module -e 'import {readFileSync} from "node:fs";const r=JSON.parse(readFileSync(process.argv[1]));const c=JSON.parse(readFileSync(process.argv[2]));if(r.sourceHead!=="96603a2346364262324569bb5839a07cea3a3eaa"||r.device!=="desktop"||r.mode!=="full"||r.requestedSeconds!==90||r.renderBackend!=="angle-metal"||!/Metal/i.test(r.actualGpu?.renderer??"")||!r.profile||r.profile.stopReason!=="trusted-W-keyup"||!r.gpsRegression||r.releasePerformanceVerified!==false||!Array.isArray(c.samples)||!c.samples.length)throw Error("Missing original diagnostic source/ride/CPU evidence");' "$report/report.json" "$report/renderer.cpuprofile"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadillac-chrome-cpu-attribution-not-release
          path: |
            evidence/
            app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/sustained-profile/full/desktop/
          if-no-files-found: warn
          retention-days: 14
