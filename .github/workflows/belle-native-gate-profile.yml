name: Belle native production gate profile diagnostic

on:
  push:
    branches: [upgrade-redesign-desktop-gate-probe-20261124]

permissions:
  contents: read

concurrency:
  group: belle-native-gate-profile-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT_PARENT_SHA: 2f9c12596d8536d3444797db47d78f2363d5eed2
  EXPERIMENT_PARENT_TREE: 2e96b0db89a35646eaf5efe153484f64cb685513
  GAME_PATH: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
  STRICT_SCRIPT_SHA256: 8f6af949083800c491b65e0709c04cc29eb5712634f744c5b912f76ce651fcf5
  MAIN_SHA256: 93d9b86bc6a8cc876e146f8843875833c5d233641dc1f5c2cbbe4943ee39aba2
  LOOP_TEST_SHA256: dc449ea773dc468d6f20991b5d6e3a80e126f1c528a646f901656a8cbe709544

jobs:
  native-gate-profile:
    name: Observe the unchanged production gate during the original strict desktop ride
    runs-on: macos-15
    # This job includes build/setup and failure retention; the native step remains 28 minutes.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the exact parent and three-file diagnostic scope
        id: preflight
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const game=process.env.GAME_PATH,out=resolve('gate-profile-evidence'),parent=process.env.EXPERIMENT_PARENT_SHA;
          await mkdir(out,{recursive:true});
          const workflow='.github/workflows/belle-native-gate-profile.yml',mainPath=game+'/src/belle/main.ts',testPath=game+'/src/belle/rideProfileLoop.test.mjs';
          const expectedChanges=['A\t'+workflow,'M\t'+mainPath,'M\t'+testPath].sort();
          const proof={version:1,repository:'robjasper2084/Jungle-Lotto',commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),
            parents:git('show','-s','--format=%P','HEAD').split(' ').filter(Boolean),expectedParent:parent,
            expectedParentTree:process.env.EXPERIMENT_PARENT_TREE,expectedChanges,
            actualChanges:git('diff','--no-renames','--name-status',parent,'HEAD').split('\n').filter(Boolean).sort(),verified:false};
          await writeFile(resolve(out,'source-preflight.json'),JSON.stringify(proof,null,2)+'\n');
          assert.equal(proof.commit,process.env.GITHUB_SHA);
          assert.deepEqual(proof.parents,[parent],'Exactly the reviewed application/fixture source must be the sole parent');
          assert.equal(git('rev-parse',parent+'^{tree}'),proof.expectedParentTree);
          assert.deepEqual(proof.actualChanges,expectedChanges,'Only the new workflow and two reviewed app/test files may change');
          const raw=git('diff','--no-renames','--raw',parent,'HEAD').split('\n').filter(Boolean);
          assert.equal(raw.length,3);
          for(const line of raw){
            const match=line.match(/^:(\d{6}) (\d{6}) [0-9a-f]+ [0-9a-f]+ ([AM])\t(.+)$/);
            assert(match&&match[2]==='100644'&&(match[3]==='A'?match[1]==='000000'&&match[4]===workflow:match[1]==='100644'),'No mode, type, rename or unrelated change');
          }
          const main=await readFile(mainPath,'utf8'),test=await readFile(testPath);
          assert.equal(hash(main),process.env.MAIN_SHA256);assert.equal(hash(test),process.env.LOOP_TEST_SHA256);
          const added=" // Local browser captures can observe the existing gate without the broader\n // manual render observers. The original callback and native GL calls are unchanged.\n const localLoopProfile=['localhost','127.0.0.1','[::1]'].includes(location.hostname)&&new URLSearchParams(location.search).get('profile')==='1';\n";
          const declaration='const loopProbe=renderProbe||localLoopProfile?new ManualLoopProbe():undefined;';
          assert.equal(main.split(added).length,2);assert.equal(main.split(declaration).length,2);
          const normalized=main.replace(added,'').replace(declaration,'const loopProbe=renderProbe?new ManualLoopProbe():undefined;');
          const original=execFileSync('git',['show',parent+':'+mainPath],{encoding:'utf8',maxBuffer:16*1024*1024});
          assert.equal(normalized,original,'The local-only loop-probe attachment is the entire main.ts change');
          proof.main={parentSha256:hash(original),candidateSha256:hash(main),normalizedSha256:hash(normalized)};
          proof.unchanged={};
          for(const path of [game+'/src/belle/gpuFramePacing.ts',game+'/src/belle/loopDiagnostics.ts',game+'/src/belle/rideProfile.ts',
            game+'/src/belle/renderDiagnostics.ts',game+'/src/belle/renderSubmissionDiagnostics.ts',game+'/scripts/sustained-ride-profile.mjs',
            '.github/workflows/belle-sustained-profile.yml','.github/workflows/belle-cadillac-mods.yml']){
            const before=git('rev-parse',parent+':'+path),after=git('rev-parse','HEAD:'+path);
            assert.equal(after,before,'Existing gate, observers, strict driver and required workflows must remain unchanged: '+path);
            proof.unchanged[path]=after;
          }
          for(const ref of [parent,'HEAD']){
            const bytes=execFileSync('git',['show',ref+':'+game+'/scripts/sustained-ride-profile.mjs'],{maxBuffer:16*1024*1024});
            assert.equal(hash(bytes),process.env.STRICT_SCRIPT_SHA256);
          }
          execFileSync('git',['diff','--exit-code','HEAD','--']);
          proof.verified=true;proof.verifiedAt=new Date().toISOString();
          await writeFile(resolve(out,'source-preflight.json'),JSON.stringify(proof,null,2)+'\n');
          NODE
      - name: Check test and build the exact full-game source
        id: build
        timeout-minutes: 8
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          node --check scripts/sustained-ride-profile.mjs
          npm run build
      - name: Install the locked native browser runtime
        id: browser
        timeout-minutes: 4
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Retain complete source inputs and immutable build hashes
        id: identity
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile,mkdir} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const root=resolve('.'),game=resolve(process.env.GAME_PATH),out=resolve('gate-profile-evidence');
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const blob=bytes=>createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const repoPath=path=>relative(root,path).split(sep).join('/');
          const preflight=JSON.parse(await readFile(resolve(out,'source-preflight.json'),'utf8'));
          assert(preflight.verified);assert.equal(preflight.commit,process.env.GITHUB_SHA);
          assert.equal(git('rev-parse','HEAD'),preflight.commit);assert.equal(git('rev-parse','HEAD^{tree}'),preflight.tree);
          assert.equal(git('rev-parse','HEAD^'),process.env.EXPERIMENT_PARENT_SHA);
          const sourcePaths=['package.json','package-lock.json','../../package.json','../../package-lock.json','index.html','vite.config.ts','tsconfig.json','run-tests.mjs'].map(path=>resolve(game,path));
          async function sourceWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await sourceWalk(path);
            else{assert(entry.isFile(),'Unexpected source symlink/nonfile: '+path);sourcePaths.push(path);}
          }}
          for(const directory of ['src','runtime','scripts','../tools'])await sourceWalk(resolve(game,directory));
          await sourceWalk(resolve('.github/workflows'));
          const inventory=sourcePaths.map(repoPath).sort();assert.equal(new Set(inventory).size,inventory.length);
          assert(inventory.every(path=>path&&!path.startsWith('../')));
          const tracked=execFileSync('git',['ls-tree','-r','-z','HEAD'],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean);
          const committed=new Map(tracked.map(line=>{const at=line.indexOf('\t');return[line.slice(at+1),line.slice(0,at).split(' ')];}));
          const sources={};
          for(const path of inventory){
            const entry=committed.get(path);assert(entry&&entry[1]==='blob'&&['100644','100755'].includes(entry[0]),'Every source input must be an ordinary committed file: '+path);
            const bytes=await readFile(resolve(root,path));assert.equal(blob(bytes),entry[2],'Source differs from committed bytes: '+path);
            sources[path]={sha256:hash(bytes),gitBlob:entry[2],bytes:bytes.length,mode:entry[0]};
          }
          assert.equal(sources[process.env.GAME_PATH+'/scripts/sustained-ride-profile.mjs'].sha256,process.env.STRICT_SCRIPT_SHA256);
          const researchPath=repoPath(resolve(game,'../research/street-detail-stats.json'));
          const committedResearch=execFileSync('git',['show','HEAD:'+researchPath],{maxBuffer:16*1024*1024}),builtResearch=await readFile(researchPath);
          const metadataOut=resolve(out,'build-metadata');await mkdir(metadataOut,{recursive:true});
          await writeFile(resolve(metadataOut,'street-detail-stats.committed.json'),committedResearch);
          await writeFile(resolve(metadataOut,'street-detail-stats.post-build.json'),builtResearch);
          const before=JSON.parse(committedResearch),after=JSON.parse(builtResearch);
          for(const value of [before,after])assert(value&&typeof value==='object'&&!Array.isArray(value)&&Object.hasOwn(value,'buildMs')&&typeof value.buildMs==='number'&&Number.isFinite(value.buildMs)&&value.buildMs>=0);
          const {buildMs:committedBuildMs,...beforeContent}=before,{buildMs:actualBuildMs,...afterContent}=after;
          assert.deepEqual(afterContent,beforeContent,'Only the measured numeric buildMs field may change');
          const trackedChanges=git('diff','--no-renames','--name-status','HEAD','--').split('\n').filter(Boolean);
          assert.deepEqual(trackedChanges,hash(committedResearch)===hash(builtResearch)?[]:['M\t'+researchPath]);
          const trackedRawChanges=git('diff','--no-renames','--raw','HEAD','--').split('\n').filter(Boolean);
          for(const line of trackedRawChanges){
            const match=line.match(/^:(\d{6}) (\d{6}) [0-9a-f]+ [0-9a-f]+ M\t(.+)$/);
            assert(match&&match[1]===match[2]&&match[3]===researchPath,'No other content, mode or type may change');
          }
          const buildMetadata={path:researchPath,permittedField:'buildMs',semanticMatchExceptBuildMs:true,trackedChanges,trackedRawChanges,
            committed:{sha256:hash(committedResearch),bytes:committedResearch.length,buildMs:committedBuildMs},
            postBuild:{sha256:hash(builtResearch),bytes:builtResearch.length,buildMs:actualBuildMs}};
          await writeFile(resolve(metadataOut,'verification.json'),JSON.stringify(buildMetadata,null,2)+'\n');
          const files=[];async function buildWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await buildWalk(path);
            else{assert(entry.isFile(),'Unexpected dist symlink/nonfile: '+path);const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});}
          }}await buildWalk(resolve(game,'dist'));files.sort((a,b)=>a.path<b.path?-1:a.path>b.path?1:0);
          assert(files.length>0&&files.some(file=>file.path==='index.html')&&files.some(file=>/^assets\/main-[^/]+\.js$/.test(file.path)),'Full build entry and application bundle are required');
          const record={version:1,repository:'robjasper2084/Jungle-Lotto',commit:preflight.commit,tree:preflight.tree,parent:preflight.expectedParent,
            node:process.version,builtAt:new Date().toISOString(),buildId:'native-gate-profile-'+process.env.GITHUB_RUN_ID+'-'+preflight.commit,
            sourceRoots:['src','runtime','scripts','../tools','.github/workflows'],sources,files,buildMetadata,
            scope:'One unchanged strict full desktop driver on native macOS Metal with profile=1 and the existing production GPU gate. Only the existing ManualLoopProbe is additionally attached for a local browser capture; manual nature/render-submission observers remain disabled. Original browser/startup/CDP observers, high/60 settings, native input, 90-second ride, frame/GPS checks and 28-minute native deadline remain unchanged. This is diagnostic evidence and cannot supersede PR210 gates or grant release acceptance.'};
          await writeFile(resolve(out,'source-integrity.json'),JSON.stringify(record,null,2)+'\n');
          console.log('BELLE_NATIVE_GATE_BUILD '+JSON.stringify({commit:record.commit,tree:record.tree,parent:record.parent,sourceInputs:inventory.length,builtFiles:files.length,strictScriptSha256:process.env.STRICT_SCRIPT_SHA256}));
          NODE
      - name: Run the original strict 90-second full desktop ride and GPS checks
        id: profile
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 28
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: node scripts/sustained-ride-profile.mjs
      - name: Reverify all source and build bytes after the native process
        id: integrity_after
        if: ${{ always() && steps.identity.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const root=resolve('.'),game=resolve(process.env.GAME_PATH),out=resolve('gate-profile-evidence');
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const blob=bytes=>createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          const original=JSON.parse(await readFile(resolve(out,'source-integrity.json'),'utf8'));
          const proof={version:1,commit:process.env.GITHUB_SHA,unchanged:false,errors:[]};
          try{
            assert.equal(git('rev-parse','HEAD'),original.commit);assert.equal(git('rev-parse','HEAD^{tree}'),original.tree);
            assert.equal(git('rev-parse','HEAD^'),original.parent);assert.equal(original.commit,process.env.GITHUB_SHA);
            assert.deepEqual(git('diff','--no-renames','--name-status','HEAD','--').split('\n').filter(Boolean),original.buildMetadata.trackedChanges);
            assert.deepEqual(git('diff','--no-renames','--raw','HEAD','--').split('\n').filter(Boolean),original.buildMetadata.trackedRawChanges);
            const researchPath=relative(root,resolve(game,'../research/street-detail-stats.json')).split(sep).join('/');
            assert.equal(original.buildMetadata.path,researchPath);assert.equal(original.buildMetadata.permittedField,'buildMs');
            const research=await readFile(researchPath);
            assert.equal(hash(research),original.buildMetadata.postBuild.sha256);assert.equal(research.length,original.buildMetadata.postBuild.bytes);
            const paths=['package.json','package-lock.json','../../package.json','../../package-lock.json','index.html','vite.config.ts','tsconfig.json','run-tests.mjs'].map(path=>resolve(game,path));
            async function sourceWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
              const path=resolve(directory,entry.name);if(entry.isDirectory())await sourceWalk(path);else{assert(entry.isFile());paths.push(path);}
            }}
            for(const directory of ['src','runtime','scripts','../tools'])await sourceWalk(resolve(game,directory));await sourceWalk(resolve('.github/workflows'));
            const inventory=paths.map(path=>relative(root,path).split(sep).join('/')).sort();
            assert.deepEqual(inventory,Object.keys(original.sources).sort(),'Complete source inventory changed');
            for(const path of inventory){
              const bytes=await readFile(path),expected=original.sources[path];
              assert.equal(bytes.length,expected.bytes);assert.equal(hash(bytes),expected.sha256,'Source bytes changed: '+path);assert.equal(blob(bytes),expected.gitBlob);
            }
            const files=[];async function buildWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
              const path=resolve(directory,entry.name);if(entry.isDirectory())await buildWalk(path);else{
                assert(entry.isFile());const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});
              }
            }}await buildWalk(resolve(game,'dist'));files.sort((a,b)=>a.path<b.path?-1:a.path>b.path?1:0);
            assert.deepEqual(files,original.files,'Complete build inventory or bytes changed');
            Object.assign(proof,{tree:original.tree,parent:original.parent,sourceInputs:inventory.length,builtFiles:files.length,
              buildMetadata:{path:researchPath,sha256:hash(research),bytes:research.length,unchangedSinceBuild:true},unchanged:true});
          }catch(error){proof.errors.push(String(error?.stack??error));}
          proof.verifiedAt=new Date().toISOString();
          await writeFile(resolve(out,'source-integrity-after.json'),JSON.stringify(proof,null,2)+'\n');
          assert(proof.unchanged,'Source/build verification failed; inspect retained source-integrity-after.json');
          NODE
      - name: Validate loop-only coverage without waiving the original strict result
        id: coverage
        if: ${{ always() && steps.identity.outcome == 'success' }}
        timeout-minutes: 1
        env:
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const out=resolve('gate-profile-evidence'),proof={version:1,sourceHead:process.env.GITHUB_SHA,diagnosticValid:false,
            nativeStepOutcome:process.env.PROFILE_OUTCOME??'unknown',releaseAcceptance:false,errors:[],
            note:'Raw native report and original runner outcome remain authoritative and unchanged. A complete diagnostic is not a passing frame/GPS gate. A report is written before cleanup and does not prove browser-close success; exact process exit details remain in the original runner log. Loop all-callback totals, accepted-sample totals and lifetime gate-counter deltas describe different populations. gateReadyCpuMs includes the existing gate readiness operation, not only clientWaitSync. Nested scopes must not be added. The bounded top100 lists are not complete outcome distributions; wall gaps and pending spans are not GPU execution times. Observer overhead is included.'};
          try{
            const bytes=await readFile(resolve(process.env.GAME_PATH,'output/sustained-profile/full/desktop/report.json')),report=JSON.parse(bytes);
            proof.reportSha256=createHash('sha256').update(bytes).digest('hex');
            proof.originalResult={passed:report.passed,baselinePassed:report.baselinePassed,classification:report.classification,
              frameQualityAccepted:report.frameQualityAccepted,gpsPassed:report.gpsRegression?.passed??null};
            assert.equal(process.platform,'darwin');assert.equal(report.sourceHead,process.env.GITHUB_SHA);
            assert.equal(report.device,'desktop');assert.equal(report.mode,'full');assert.equal(report.requestedSeconds,90);
            assert.deepEqual(report.viewport,{width:1440,height:900});assert.match(report.hardware,/^Chrome darwin /);
            assert.equal(report.renderBackend,'angle-metal');assert.equal(report.rendererFallback,null);
            for(const renderer of [report.probeRenderer,report.actualGpu?.renderer]){
              assert.equal(typeof renderer,'string');assert.match(renderer,/ANGLE/i);assert.match(renderer,/Metal/i);
              assert(!/SwiftShader|llvmpipe|lavapipe|software rasterizer/i.test(renderer),'Software fallback is forbidden');
            }
            assert.deepEqual(report.errors,[]);assert.deepEqual(report.failedRequests,[]);assert.equal(report.releasePerformanceVerified,false);
            assert.equal(typeof report.passed,'boolean');assert.equal(typeof report.baselinePassed,'boolean');
            assert.equal(proof.nativeStepOutcome,report.passed?'success':'failure','Native step/report mismatch');
            const profile=report.profile,loop=profile?.loopDiagnostics;
            assert.equal(profile?.stopReason,'trusted-W-keyup');assert.equal(profile.version,6);
            assert(report.input?.keydowns>=1&&report.input?.keyups>=1&&!report.input.heartbeatError);
            assert.deepEqual(profile.viewport,[1440,900,1]);
            for(const settings of [profile.settingsAtStart,profile.settings]){
              assert.equal(settings.quality,'high');assert.equal(settings.effectiveQuality,'high');assert.equal(settings.cap,60);
              assert.equal(settings.pixelRatio,1);assert.equal(settings.adaptiveScale,1);
              assert.equal(settings.diagnosticReduction,false);assert.equal(settings.world?.performanceDiagnostic,false);
            }
            assert.equal(profile.buildAtStart?.reason,'manual comparison not selected');assert.equal(profile.build?.reason,'manual comparison not selected');
            assert.equal(profile.submissionInstrumentation?.atStart,null);assert.equal(profile.submissionInstrumentation?.atFinish,null);
            assert(!Object.hasOwn(profile,'renderDiagnostics'));assert(!Object.hasOwn(profile,'submissionDiagnostics'));
            assert.equal(report.frameQualityAccepted,profile.metrics.frameMs.p95<=50&&profile.over250ms===0);
            assert.equal(typeof report.gpsRegression?.passed,'boolean');
            assert.equal(report.passed,report.baselinePassed&&report.gpsRegression.passed&&!report.errors.length&&!report.failedRequests.length);
            assert.equal(loop?.status,'available');assert.equal(loop.capturing,false);
            for(const coverage of [loop.coverage?.atStart,loop.coverage?.atFinish]){assert.equal(coverage?.installed,true);assert.equal(coverage?.status,'installed');}
            const count=value=>assert(Number.isSafeInteger(value)&&value>=0,'Invalid count: '+value);
            const finite=value=>assert(typeof value==='number'&&Number.isFinite(value)&&value>=0,'Invalid timing: '+value);
            for(const key of ['captureEpoch','completedCallbacks','acceptedSamples','acceptedSamplesWithoutObservedCallback','invalidObservations'])count(loop[key]);
            assert(loop.captureEpoch>0&&loop.completedCallbacks>=8&&loop.acceptedSamples>=8);
            assert.equal(loop.invalidObservations,0);assert.equal(loop.acceptedSamplesWithoutObservedCallback,0);
            assert.equal(loop.acceptedSamples,profile.frames);
            const scopes=['totalWrapperCpuMs','gateReadyCpuMs','callbackBodyCpuMs','gateSubmittedCpuMs','fenceSyncCpuMs','flushCpuMs','profileSampleCpuMs'];
            for(const group of [loop.allCallbacks,loop.acceptedCallbacks]){
              count(group.callbacks);count(group.validCallbacks);count(group.invalidCallbacks);
              assert.equal(group.invalidCallbacks,0);assert.equal(group.validCallbacks,group.callbacks);
              assert.deepEqual(Object.keys(group.scopes).sort(),[...scopes].sort());
              for(const scope of Object.values(group.scopes)){
                count(scope.callbacks);count(scope.calls);assert(scope.callbacks<=group.callbacks&&scope.calls>=scope.callbacks);
                for(const key of ['cpuMs','maxCallCpuMs','maxCallbackCpuMs'])finite(scope[key]);
                assert(scope.maxCallCpuMs<=scope.maxCallbackCpuMs+1e-6&&scope.maxCallbackCpuMs<=scope.cpuMs+1e-6);
              }
              assert.equal(group.scopes.totalWrapperCpuMs.calls,group.callbacks);assert.equal(group.scopes.totalWrapperCpuMs.callbacks,group.callbacks);
              count(group.wallGap.samples);finite(group.wallGap.totalMs);finite(group.wallGap.maxMs);
              assert(group.wallGap.samples<=group.callbacks&&group.wallGap.maxMs<=group.wallGap.totalMs+1e-6);
            }
            assert.equal(loop.completedCallbacks,loop.allCallbacks.callbacks);
            const inFlight=loop.inFlightAtSnapshot;
            if(inFlight!==null){assert.equal(inFlight.incomplete,true);assert.equal(inFlight.captureEpoch,loop.captureEpoch);count(inFlight.callbackId);assert(Array.isArray(inFlight.openScopes)&&inFlight.openScopes.every(scope=>scopes.includes(scope)&&scope!=='totalWrapperCpuMs'));}
            assert.equal(loop.acceptedSamples,loop.acceptedCallbacks.callbacks+(inFlight?.acceptedSample!=null?1:0));
            for(const name of ['gateReadyCpuMs','callbackBodyCpuMs','gateSubmittedCpuMs','fenceSyncCpuMs','flushCpuMs'])assert(loop.allCallbacks.scopes[name].calls>0,'Missing production gate scope: '+name);
            assert(Array.isArray(loop.topCallbacks)&&loop.topCallbacks.length>0&&loop.topCallbacks.length<=100);
            assert(Array.isArray(loop.slowIntervals)&&loop.slowIntervals.length<=100);
            for(const row of loop.topCallbacks){
              assert.equal(row.captureEpoch,loop.captureEpoch);count(row.callbackId);assert.equal(row.invalidObservations,0);
              finite(row.rafTimestampMs);assert(['executed','no-draw','pending-fence','context-lost','xr','error'].includes(row.outcome));
              assert.deepEqual(Object.keys(row.scopes).sort(),[...scopes].sort());
              for(const scope of Object.values(row.scopes)){if(scope===null)continue;count(scope.calls);assert(scope.calls>0);assert.equal(scope.invalidCalls,0);finite(scope.cpuMs);finite(scope.maxCpuMs);assert(scope.maxCpuMs<=scope.cpuMs+1e-6);}
              assert.equal(row.scopes.totalWrapperCpuMs.calls,1);
            }
            const start=profile.gpuFramePacing?.atStart,end=profile.gpuFramePacing?.atFinish;
            assert.equal(start?.installed,true);assert.equal(end?.installed,true);
            const counterNames=['animationCallbacks','executedCallbacks','submittedCallbacks','xrCallbacks','pendingFenceSkippedCallbacks','contextLostSkippedCallbacks','pendingFenceResumptions'];
            const deltas={};for(const name of counterNames){count(start[name]);count(end[name]);assert(end[name]>=start[name]);deltas[name]=end[name]-start[name];}
            for(const name of ['animationCallbacks','executedCallbacks','submittedCallbacks'])assert(deltas[name]>0,'Production gate was not exercised: '+name);
            for(const boundary of [start,end])for(const name of ['pendingFenceObservedSpanMs','longestPendingFenceObservedSpanMs','currentPendingFenceObservedSpanMs'])finite(boundary[name]);
            assert(end.pendingFenceObservedSpanMs>=start.pendingFenceObservedSpanMs);
            proof.coverage={completedCallbacks:loop.completedCallbacks,acceptedSamples:loop.acceptedSamples,inFlightAtSnapshot:inFlight,
              allCallbacks:loop.allCallbacks,acceptedCallbacks:loop.acceptedCallbacks,topCallbacks:loop.topCallbacks.length,slowIntervals:loop.slowIntervals.length,
              lifetimeGateCounterDeltas:deltas,pendingFenceObservedSpanDeltaMs:end.pendingFenceObservedSpanMs-start.pendingFenceObservedSpanMs};
            proof.strictMetrics={frames:profile.frames,movingSeconds:profile.movingSeconds,distanceMetres:profile.distanceMetres,
              frameMs:profile.metrics.frameMs,over250ms:profile.over250ms};
            proof.diagnosticValid=true;
          }catch(error){proof.errors.push(String(error?.stack??error));}
          await writeFile(resolve(out,'diagnostic-coverage.json'),JSON.stringify(proof,null,2)+'\n');
          assert(proof.diagnosticValid,'Loop diagnostic evidence is incomplete or invalid; inspect diagnostic-coverage.json');
          NODE
      - name: Retain original outcomes and all available diagnostic evidence
        if: always()
        timeout-minutes: 2
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
          INTEGRITY_AFTER_OUTCOME: ${{ steps.integrity_after.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,cpSync,mkdirSync} from 'node:fs';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {release} from 'node:os';
          import {resolve,relative,sep} from 'node:path';
          const out=resolve('gate-profile-evidence');mkdirSync(out,{recursive:true});
          const source=resolve(process.env.GAME_PATH,'output/sustained-profile/full/desktop');
          if(existsSync(source))cpSync(source,resolve(out,'sustained-profile/full/desktop'),{recursive:true});
          const outcomes=Object.fromEntries(['PREFLIGHT','BUILD','BROWSER','IDENTITY','PROFILE','INTEGRITY_AFTER','COVERAGE'].map(name=>[name.toLowerCase(),process.env[name+'_OUTCOME']??'unknown']));
          await writeFile(resolve(out,'step-outcomes.json'),JSON.stringify({commit:process.env.GITHUB_SHA,outcomes,
            host:{platform:process.platform,arch:process.arch,osRelease:release(),runnerArch:process.env.RUNNER_ARCH??null,image:process.env.ImageOS??null,imageVersion:process.env.ImageVersion??null},
            diagnosticOnly:true,releaseAcceptance:false,
            note:'The original strict command retains its own failing or successful exit in the runner log; a step outcome is not an inferred exit code. Post-failure hashing, coverage checks and evidence retention never convert that step to success. Report presence does not prove browser cleanup. No source, full build, or asset archive is uploaded. PR210 and release gates remain separate and required.'},null,2)+'\n');
          const hashes=[];async function walk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await walk(path);else{
              if(!entry.isFile())throw Error('Unexpected evidence symlink/nonfile: '+path);
              const bytes=await readFile(path);hashes.push({path:relative(out,path).split(sep).join('/'),bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});
            }
          }}await walk(out);hashes.sort((a,b)=>a.path<b.path?-1:a.path>b.path?1:0);
          await writeFile(resolve(out,'evidence-hashes.json'),JSON.stringify(hashes,null,2)+'\n');
          NODE
      - name: Preserve failure evidence and immutable manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-native-gate-profile-${{ github.sha }}
          path: gate-profile-evidence/
          if-no-files-found: error
          retention-days: 14
