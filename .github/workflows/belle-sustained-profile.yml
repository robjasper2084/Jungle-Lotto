name: Belle Isle GPU pacing diagnostic build
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: belle-sustained-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check test and build exact candidate
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          node --check scripts/sustained-ride-profile.mjs
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sustained-profile-game
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
          if-no-files-found: error
          retention-days: 1
