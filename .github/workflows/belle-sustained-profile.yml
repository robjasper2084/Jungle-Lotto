name: Belle Isle hosted display calibration
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ${{ matrix.host }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: macos-15, device: desktop, display: window}
          - {host: macos-15, device: phone, display: window}
          - {host: macos-26, device: desktop, display: window}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: sustained-profile-game
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist
          run-id: 45078088081
          github-token: ${{ github.token }}
      - name: Install the same Chrome runtime
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Measure the display and ride the unchanged game
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: ${{ matrix.device }}
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
          BELLE_DISPLAY: ${{ matrix.display }}
        run: node scripts/sustained-ride-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: object-costs-${{ matrix.host }}-${{ matrix.device }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/sustained-profile/full/${{ matrix.device }}
          retention-days: 7
