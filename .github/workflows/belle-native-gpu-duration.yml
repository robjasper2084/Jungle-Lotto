name: Belle native GPU observer comparison diagnostic

on:
  push:
    branches: [upgrade-redesign-desktop-gpu-observer-20261124]

permissions:
  contents: read

concurrency:
  group: belle-native-gpu-duration-${{ github.ref }}
  cancel-in-progress: false

env:
  BASELINE_SHA: a3d872a23fce2e378b00b15f8e512502907106d3
  EXPERIMENT_PARENT_SHA: 1a485b08db6bfe780376e0904569d19c7012e2ad
  EXPERIMENT_PARENT_TREE: c2d86d7dea85c3c8b7a67708298b0bad46aa0e49
  INTEGRATED_MAIN_SHA: 2a8901996e53b1f93474f3c2165e078b6dd16e57
  GAME_PATH: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
  STRICT_SCRIPT_SHA256: 8f6af949083800c491b65e0709c04cc29eb5712634f744c5b912f76ce651fcf5

jobs:
  native-gpu-duration:
    name: Compare observed and omitted metadata on one full desktop build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 32
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact candidate experiment and current production ancestry
        id: preflight
        timeout-minutes: 2
        run: |
          git fetch --no-tags --depth=32 origin main:refs/remotes/origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {resolve} from 'node:path';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const names=(from,to)=>git('diff','--no-renames','--name-only',from,to).split('\n').filter(Boolean).sort();
          const game=process.env.GAME_PATH,out=resolve('gpu-duration-evidence');
          await mkdir(out,{recursive:true});
          const commit=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}');
          const parents=git('show','-s','--format=%P','HEAD').split(' ').filter(Boolean);
          const currentMain=git('rev-parse','refs/remotes/origin/main');
          const expectedExtras=['.github/workflows/belle-native-gpu-duration.yml',game+'/scripts/gpu-duration-native-check.mjs',game+'/scripts/gpu-duration-trace.mjs',game+'/scripts/gpu-duration-trace.test.mjs',game+'/src/belle/main.ts',game+'/src/belle/gpuDurationProbe.ts',game+'/src/belle/gpuDurationProbe.test.ts',game+'/src/belle/locationIntegration.test.ts',game+'/run-tests.mjs'].sort();
          const expectedIncrement=['.github/workflows/belle-native-gpu-duration.yml',game+'/scripts/gpu-duration-native-check.mjs',game+'/scripts/gpu-duration-trace.mjs',game+'/scripts/gpu-duration-trace.test.mjs',game+'/src/belle/main.ts',game+'/src/belle/gpuDurationProbe.ts',game+'/src/belle/gpuDurationProbe.test.ts'].sort();
          const proof={version:1,repository:'robjasper2084/Jungle-Lotto',commit,tree,parents,
            baseline:process.env.BASELINE_SHA,expectedParent:process.env.EXPERIMENT_PARENT_SHA,
            integratedMain:process.env.INTEGRATED_MAIN_SHA,currentMain,
            expectedExtras,actualExtras:names(process.env.BASELINE_SHA,'HEAD'),expectedIncrement,actualIncrement:names(process.env.EXPERIMENT_PARENT_SHA,'HEAD'),verified:false};
          await writeFile(resolve(out,'source-preflight.json'),JSON.stringify(proof,null,2)+'\n');
          assert.equal(commit,process.env.GITHUB_SHA);
          assert.deepEqual(parents,[process.env.EXPERIMENT_PARENT_SHA],'Observer comparison must have exactly the verified trace diagnostic as its sole parent');
          assert.equal(git('rev-parse',process.env.EXPERIMENT_PARENT_SHA+'^{tree}'),process.env.EXPERIMENT_PARENT_TREE);
          assert.deepEqual(proof.actualExtras,expectedExtras,'Only the explicit opt-in diagnostic module, integration, tests, runner, driver and workflow may differ');
          assert.deepEqual(proof.actualIncrement,expectedIncrement,'Only the seven reviewed observer comparison files may change');
          const expectedStatuses=expectedIncrement.map(path=>'M\t'+path).sort();
          assert.deepEqual(git('diff','--no-renames','--name-status',process.env.EXPERIMENT_PARENT_SHA,'HEAD').split('\n').filter(Boolean).sort(),expectedStatuses);
          const rawChanges=git('diff','--no-renames','--raw',process.env.EXPERIMENT_PARENT_SHA,'HEAD').split('\n').filter(Boolean);
          assert.equal(rawChanges.length,7);
          for(const change of rawChanges){
            const match=change.match(/^:(\d{6}) (\d{6}) [0-9a-f]+ [0-9a-f]+ M\t(.+)$/);
            assert(match&&match[1]==='100644'&&match[2]==='100644','No mode or type change is allowed');
          }
          proof.runtimeTrees={};
          for(const directory of ['runtime']){
            const path=game+'/'+directory,original=git('rev-parse',process.env.EXPERIMENT_PARENT_SHA+':'+path),candidate=git('rev-parse','HEAD:'+path);
            assert.equal(candidate,original,'The shared application runtime must remain unchanged');
            proof.runtimeTrees[path]=candidate;
          }
          const mainPath=game+'/src/belle/main.ts',main=await readFile(mainPath,'utf8');
          const parentMain=execFileSync('git',['show',process.env.EXPERIMENT_PARENT_SHA+':'+mainPath],{encoding:'utf8',maxBuffer:16*1024*1024});
          const normalizedMain=main
            .replace("import {createGpuDurationProbe,gpuDurationEnabled,gpuDurationObservationMode,gpuDurationContextExcluded} from './gpuDurationProbe.ts';","import {createGpuDurationProbe,gpuDurationEnabled,gpuDurationContextExcluded} from './gpuDurationProbe.ts';")
            .replace('createGpuDurationProbe(gpuDurationEnabled(location.search),()=>renderer.getContext(),undefined,undefined,gpuDurationObservationMode(location.search))','createGpuDurationProbe(gpuDurationEnabled(location.search),()=>renderer.getContext())');
          assert.equal(normalizedMain,parentMain,'Only the observation-mode import and probe construction option may change in main.ts');
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          proof.mainIntegration={path:mainPath,parentSha256:hash(parentMain),candidateSha256:hash(main),normalizedSha256:hash(normalizedMain)};
          execFileSync('git',['merge-base','--is-ancestor',process.env.BASELINE_SHA,process.env.EXPERIMENT_PARENT_SHA]);
          execFileSync('git',['merge-base','--is-ancestor',process.env.INTEGRATED_MAIN_SHA,process.env.BASELINE_SHA]);
          execFileSync('git',['merge-base','--is-ancestor',currentMain,process.env.BASELINE_SHA]);
          execFileSync('git',['diff','--exit-code','HEAD','--']);
          proof.verified=true;proof.verifiedAt=new Date().toISOString();
          await writeFile(resolve(out,'source-preflight.json'),JSON.stringify(proof,null,2)+'\n');
          NODE
      - name: Typecheck test and build the exact experiment source
        id: build
        timeout-minutes: 8
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          node --check scripts/sustained-ride-profile.mjs
          node --check scripts/gpu-duration-native-check.mjs
          node --check scripts/gpu-duration-trace.mjs
          node --test scripts/gpu-duration-trace.test.mjs
          npm run build
      - name: Retain committed source hashes and the immutable full-game build
        id: identity
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile,mkdir} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const game=resolve(process.env.GAME_PATH),out=resolve('gpu-duration-evidence');
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const preflight=JSON.parse(await readFile(resolve(out,'source-preflight.json'),'utf8'));
          const commit=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),parent=git('rev-parse','HEAD^');
          assert(preflight.verified);assert.equal(commit,process.env.GITHUB_SHA);assert.equal(commit,preflight.commit);
          assert.equal(tree,preflight.tree);assert.equal(parent,process.env.EXPERIMENT_PARENT_SHA);assert.equal(parent,preflight.expectedParent);
          const sourceFiles=['package.json','package-lock.json','../../package.json','../../package-lock.json','index.html','vite.config.ts','tsconfig.json','run-tests.mjs'];
          async function sourceWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);
            if(entry.isDirectory())await sourceWalk(path);
            else{assert(entry.isFile(),'Unexpected source symlink/nonfile: '+path);if(/\.(?:ts|mjs|js)$/.test(entry.name))sourceFiles.push(relative(game,path).split(sep).join('/'));}
          }}for(const directory of ['src','runtime','scripts','../tools'])await sourceWalk(resolve(game,directory));
          sourceFiles.sort();assert.equal(new Set(sourceFiles).size,sourceFiles.length);
          const sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>{
            const bytes=await readFile(resolve(game,path)),repoPath=relative(resolve('.'),resolve(game,path)).split(sep).join('/');
            assert(!repoPath.startsWith('../'),'Source must belong to this checkout');
            const committed=execFileSync('git',['show','HEAD:'+repoPath]);
            assert.equal(hash(bytes),hash(committed),'Source differs from committed bytes: '+path);
            return [path,hash(bytes)];
          })));
          assert.equal(sources['scripts/sustained-ride-profile.mjs'],process.env.STRICT_SCRIPT_SHA256);
          for(const ref of [process.env.BASELINE_SHA,process.env.EXPERIMENT_PARENT_SHA,process.env.INTEGRATED_MAIN_SHA,preflight.currentMain]){
            const original=execFileSync('git',['show',ref+':'+process.env.GAME_PATH+'/scripts/sustained-ride-profile.mjs']);
            assert.equal(hash(original),process.env.STRICT_SCRIPT_SHA256,'Original strict riding/GPS script must remain unchanged at '+ref);
          }
          const workflowPath='.github/workflows/belle-native-gpu-duration.yml',workflowBytes=await readFile(workflowPath);
          assert.equal(hash(workflowBytes),hash(execFileSync('git',['show','HEAD:'+workflowPath])),'Workflow differs from committed bytes');
          // The existing street builder records elapsed buildMs in one tracked research
          // report. Retain that report and prove this is its sole semantic difference.
          const researchPath=relative(resolve('.'),resolve(game,'../research/street-detail-stats.json')).split(sep).join('/');
          const committedResearch=execFileSync('git',['show','HEAD:'+researchPath]),builtResearch=await readFile(researchPath);
          const researchDirectory=resolve(out,'build-metadata');await mkdir(researchDirectory,{recursive:true});
          await writeFile(resolve(researchDirectory,'street-detail-stats.committed.json'),committedResearch);
          await writeFile(resolve(researchDirectory,'street-detail-stats.post-build.json'),builtResearch);
          const committedStats=JSON.parse(committedResearch),builtStats=JSON.parse(builtResearch);
          for(const [label,value] of [['committed',committedStats],['post-build',builtStats]]){
            assert(value&&typeof value==='object'&&!Array.isArray(value),'Street report must be a JSON object: '+label);
            assert(Object.hasOwn(value,'buildMs')&&typeof value.buildMs==='number'&&Number.isFinite(value.buildMs)&&value.buildMs>=0,'Street buildMs must be finite and nonnegative: '+label);
          }
          const {buildMs:committedBuildMs,...committedContent}=committedStats,{buildMs:actualBuildMs,...builtContent}=builtStats;
          assert.deepEqual(builtContent,committedContent,'Street report may change only its numeric buildMs');
          const trackedChanges=git('diff','--no-renames','--name-status','HEAD','--').split('\n').filter(Boolean);
          const expectedChanges=hash(committedResearch)===hash(builtResearch)?[]:['M\t'+researchPath];
          assert.deepEqual(trackedChanges,expectedChanges,'Only the explicitly verified street build-time report may differ from HEAD');
          const trackedRawChanges=git('diff','--no-renames','--raw','HEAD','--').split('\n').filter(Boolean);
          for(const change of trackedRawChanges){
            const match=change.match(/^:(\d{6}) (\d{6}) [0-9a-f]+ [0-9a-f]+ M\t(.+)$/);
            assert(match&&match[1]===match[2]&&match[3]===researchPath,'No tracked mode, type, rename or unrelated change is allowed');
          }
          const buildMetadata={path:researchPath,permittedField:'buildMs',semanticMatchExceptBuildMs:true,trackedChanges,trackedRawChanges,
            committed:{sha256:hash(committedResearch),bytes:committedResearch.length,buildMs:committedBuildMs,artifact:'build-metadata/street-detail-stats.committed.json'},
            postBuild:{sha256:hash(builtResearch),bytes:builtResearch.length,buildMs:actualBuildMs,artifact:'build-metadata/street-detail-stats.post-build.json'},
            note:'The unchanged build-street-detail.mjs writes measured build duration here. Original and actual bytes are retained; this exact metadata exception does not permit runtime source, asset-content or other tracked changes.'};
          await writeFile(resolve(researchDirectory,'verification.json'),JSON.stringify(buildMetadata,null,2)+'\n');
          const files=[];async function buildWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);
            if(entry.isDirectory())await buildWalk(path);
            else{assert(entry.isFile(),'Unexpected dist symlink/nonfile: '+path);const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});}
          }}await buildWalk(resolve(game,'dist'));files.sort((a,b)=>a.path.localeCompare(b.path));
          assert.equal(files.length,195,'Preserve the complete 195-file full-game build inventory');
          assert(files.some(file=>file.path==='index.html'),'Full-game entry point missing');
          const metadata={version:1,repository:'robjasper2084/Jungle-Lotto',commit,tree,parent,baseline:process.env.BASELINE_SHA,
            integratedMainCommit:process.env.INTEGRATED_MAIN_SHA,currentMainCommit:preflight.currentMain,
            buildId:'native-gpu-duration-'+process.env.GITHUB_RUN_ID+'-'+commit,builtAt:new Date().toISOString(),node:process.version,
            workflow:{path:workflowPath,sha256:hash(workflowBytes)},buildMetadata,sources,files,
            comparison:{executionOrder:['read-msaa','omit-msaa'],sameBuild:true,freshBrowserPerLane:true,queryCap:256,windowSeconds:90},
            scope:'One immutable full-game build is used in fixed read-msaa then omit-msaa order, each in a fresh native Metal browser with identical bounded host tracing. Omission removes only diagnostic SAMPLES/SAMPLE_BUFFERS reads and their timing receipts; their metadata remains null/unobserved. Remaining GL calls, query placement/cadence/caps, native input, rendering settings, frame pacing, 90-second ride, strict frame limits and GPS checks remain. Both original failing exit statuses are retained. Source and all 195 built files are verified between and after lanes. Trace overhead, order/cache/load effects, changed progression, and earlier attainment of the unchanged 256-query cap limit causal interpretation; compare common early trace coverage separately. No result grants release acceptance or replaces required phone coverage.'};
          await writeFile(resolve(out,'source-integrity.json'),JSON.stringify(metadata,null,2)+'\n');
          console.log('BELLE_GPU_DURATION_BUILD '+JSON.stringify({commit,tree,parent,baseline:metadata.baseline,buildId:metadata.buildId,files:files.length,sourceFiles:sourceFiles.length,strictScriptSha256:sources['scripts/sustained-ride-profile.mjs']}));
          NODE
      - name: Install the locked browser driver and Chrome
        id: browser
        timeout-minutes: 4
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Read MSAA metadata during the unchanged full desktop ride
        id: read_msaa
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.browser.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
          BELLE_GPU_TRACE: '1'
          BELLE_GPU_OBSERVER_MODE: read-msaa
        run: node scripts/gpu-duration-native-check.mjs
      - name: Verify source build and successful teardown between comparison lanes
        id: integrity_between
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 1
        env:
          EXPECTED_LANE: read-msaa
          EXPECTED_LANE_INDEX: '0'
          INTEGRITY_STAGE: between
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const game=resolve(process.env.GAME_PATH),out=resolve('gpu-duration-evidence'),hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const original=JSON.parse(await readFile(resolve(out,'source-integrity.json'),'utf8'));
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),original.commit);assert.equal(git('rev-parse','HEAD^{tree}'),original.tree);
          assert.equal(git('rev-parse','HEAD^'),original.parent);
          assert.deepEqual(git('diff','--no-renames','--name-status','HEAD','--').split('\n').filter(Boolean),original.buildMetadata.trackedChanges,'Tracked changes differ from the explicitly verified post-build metadata');
          assert.deepEqual(git('diff','--no-renames','--raw','HEAD','--').split('\n').filter(Boolean),original.buildMetadata.trackedRawChanges,'Tracked modes, types or contents changed after the build');
          const researchPath=relative(resolve('.'),resolve(game,'../research/street-detail-stats.json')).split(sep).join('/');
          assert.equal(original.buildMetadata.path,researchPath);assert.equal(original.buildMetadata.permittedField,'buildMs');
          const researchBytes=await readFile(researchPath);
          assert.equal(researchBytes.length,original.buildMetadata.postBuild.bytes,'Post-build street metadata size changed during the browser checks');
          assert.equal(hash(researchBytes),original.buildMetadata.postBuild.sha256,'Post-build street metadata bytes changed during the browser checks');
          assert.equal(hash(await readFile(original.workflow.path)),original.workflow.sha256);
          const sourceFiles=['package.json','package-lock.json','../../package.json','../../package-lock.json','index.html','vite.config.ts','tsconfig.json','run-tests.mjs'];
          async function sourceWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await sourceWalk(path);
            else{assert(entry.isFile());if(/\.(?:ts|mjs|js)$/.test(entry.name))sourceFiles.push(relative(game,path).split(sep).join('/'));}
          }}for(const directory of ['src','runtime','scripts','../tools'])await sourceWalk(resolve(game,directory));sourceFiles.sort();
          assert.deepEqual(sourceFiles,Object.keys(original.sources).sort(),'Exact source inventory changed');
          const sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>[path,hash(await readFile(resolve(game,path)))])));
          assert.deepEqual(sources,original.sources,'Source bytes changed');
          const files=[];async function buildWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await buildWalk(path);
            else{assert(entry.isFile());const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});}
          }}await buildWalk(resolve(game,'dist'));files.sort((a,b)=>a.path.localeCompare(b.path));
          assert.equal(files.length,195);assert.deepEqual(files,original.files,'Full build inventory or bytes changed');
          const lane=process.env.EXPECTED_LANE,index=Number(process.env.EXPECTED_LANE_INDEX),stage=process.env.INTEGRITY_STAGE;
          assert((lane==='read-msaa'&&index===0&&stage==='between')||(lane==='omit-msaa'&&index===1&&stage==='after'));
          const laneRoot=resolve(game,'output/gpu-duration-profile/observer-comparison',lane,'full/desktop');
          const completionBytes=await readFile(resolve(laneRoot,'observer-completion.json')),completion=JSON.parse(completionBytes);
          const reportBytes=await readFile(resolve(laneRoot,'report.json')),report=JSON.parse(reportBytes);
          assert.equal(completion.sourceHead,original.commit);assert.equal(completion.mode,lane);assert.equal(completion.laneIndex,index);
          assert.deepEqual(completion.executionOrder,['read-msaa','omit-msaa']);assert.deepEqual(completion.errors,[]);
          assert.equal(completion.browserCloseSucceeded,true,'A report written before browser teardown does not authorize another lane');
          assert.equal(completion.serverKnownNotListening,true);assert.equal(completion.complete,true);
          assert.equal(report.sourceHead,original.commit);assert.equal(report.gpuObserverComparison?.mode,lane);assert.equal(report.gpuObserverComparison?.laneIndex,index);
          assert.deepEqual(report.gpuObserverComparison?.executionOrder,['read-msaa','omit-msaa']);
          assert.deepEqual(report.gpuObserverCompletion,{file:'observer-completion.json',complete:true});
          const laneEvidence={mode:lane,laneIndex:index,completionSha256:hash(completionBytes),reportSha256:hash(reportBytes)};
          if(stage==='after'){
            const between=JSON.parse(await readFile(resolve(out,'source-integrity-between.json'),'utf8'));
            assert.equal(between.commit,original.commit);assert.equal(between.tree,original.tree);assert.equal(between.unchanged,true);
            const firstRoot=resolve(game,'output/gpu-duration-profile/observer-comparison/read-msaa/full/desktop');
            assert.equal(hash(await readFile(resolve(firstRoot,'observer-completion.json'))),between.laneEvidence.completionSha256,'Baseline completion proof changed during omission');
            assert.equal(hash(await readFile(resolve(firstRoot,'report.json'))),between.laneEvidence.reportSha256,'Baseline report changed during omission');
          }
          await writeFile(resolve(out,'source-integrity-'+stage+'.json'),JSON.stringify({commit:original.commit,tree:original.tree,laneEvidence,
            sourceFiles:sourceFiles.length,builtFiles:files.length,verifiedAt:new Date().toISOString(),unchanged:true,
            buildMetadata:{path:researchPath,sha256:hash(researchBytes),bytes:researchBytes.length,buildMs:JSON.parse(researchBytes).buildMs,unchangedSinceBuild:true}},null,2)+'\n');
          NODE
      - name: Omit only MSAA metadata reads during the unchanged full desktop ride
        id: omit_msaa
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.browser.outcome == 'success' && steps.integrity_between.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
          BELLE_GPU_TRACE: '1'
          BELLE_GPU_OBSERVER_MODE: omit-msaa
        run: node scripts/gpu-duration-native-check.mjs
      - name: Verify source build and both retained lanes after the comparison
        id: integrity_after
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 1
        env:
          EXPECTED_LANE: omit-msaa
          EXPECTED_LANE_INDEX: '1'
          INTEGRITY_STAGE: after
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const game=resolve(process.env.GAME_PATH),out=resolve('gpu-duration-evidence'),hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const original=JSON.parse(await readFile(resolve(out,'source-integrity.json'),'utf8'));
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),original.commit);assert.equal(git('rev-parse','HEAD^{tree}'),original.tree);
          assert.equal(git('rev-parse','HEAD^'),original.parent);
          assert.deepEqual(git('diff','--no-renames','--name-status','HEAD','--').split('\n').filter(Boolean),original.buildMetadata.trackedChanges,'Tracked changes differ from the explicitly verified post-build metadata');
          assert.deepEqual(git('diff','--no-renames','--raw','HEAD','--').split('\n').filter(Boolean),original.buildMetadata.trackedRawChanges,'Tracked modes, types or contents changed after the build');
          const researchPath=relative(resolve('.'),resolve(game,'../research/street-detail-stats.json')).split(sep).join('/');
          assert.equal(original.buildMetadata.path,researchPath);assert.equal(original.buildMetadata.permittedField,'buildMs');
          const researchBytes=await readFile(researchPath);
          assert.equal(researchBytes.length,original.buildMetadata.postBuild.bytes,'Post-build street metadata size changed during the browser checks');
          assert.equal(hash(researchBytes),original.buildMetadata.postBuild.sha256,'Post-build street metadata bytes changed during the browser checks');
          assert.equal(hash(await readFile(original.workflow.path)),original.workflow.sha256);
          const sourceFiles=['package.json','package-lock.json','../../package.json','../../package-lock.json','index.html','vite.config.ts','tsconfig.json','run-tests.mjs'];
          async function sourceWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await sourceWalk(path);
            else{assert(entry.isFile());if(/\.(?:ts|mjs|js)$/.test(entry.name))sourceFiles.push(relative(game,path).split(sep).join('/'));}
          }}for(const directory of ['src','runtime','scripts','../tools'])await sourceWalk(resolve(game,directory));sourceFiles.sort();
          assert.deepEqual(sourceFiles,Object.keys(original.sources).sort(),'Exact source inventory changed');
          const sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>[path,hash(await readFile(resolve(game,path)))])));
          assert.deepEqual(sources,original.sources,'Source bytes changed');
          const files=[];async function buildWalk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await buildWalk(path);
            else{assert(entry.isFile());const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});}
          }}await buildWalk(resolve(game,'dist'));files.sort((a,b)=>a.path.localeCompare(b.path));
          assert.equal(files.length,195);assert.deepEqual(files,original.files,'Full build inventory or bytes changed');
          const lane=process.env.EXPECTED_LANE,index=Number(process.env.EXPECTED_LANE_INDEX),stage=process.env.INTEGRITY_STAGE;
          assert((lane==='read-msaa'&&index===0&&stage==='between')||(lane==='omit-msaa'&&index===1&&stage==='after'));
          const laneRoot=resolve(game,'output/gpu-duration-profile/observer-comparison',lane,'full/desktop');
          const completionBytes=await readFile(resolve(laneRoot,'observer-completion.json')),completion=JSON.parse(completionBytes);
          const reportBytes=await readFile(resolve(laneRoot,'report.json')),report=JSON.parse(reportBytes);
          assert.equal(completion.sourceHead,original.commit);assert.equal(completion.mode,lane);assert.equal(completion.laneIndex,index);
          assert.deepEqual(completion.executionOrder,['read-msaa','omit-msaa']);assert.deepEqual(completion.errors,[]);
          assert.equal(completion.browserCloseSucceeded,true,'A report written before browser teardown does not authorize another lane');
          assert.equal(completion.serverKnownNotListening,true);assert.equal(completion.complete,true);
          assert.equal(report.sourceHead,original.commit);assert.equal(report.gpuObserverComparison?.mode,lane);assert.equal(report.gpuObserverComparison?.laneIndex,index);
          assert.deepEqual(report.gpuObserverComparison?.executionOrder,['read-msaa','omit-msaa']);
          assert.deepEqual(report.gpuObserverCompletion,{file:'observer-completion.json',complete:true});
          const laneEvidence={mode:lane,laneIndex:index,completionSha256:hash(completionBytes),reportSha256:hash(reportBytes)};
          if(stage==='after'){
            const between=JSON.parse(await readFile(resolve(out,'source-integrity-between.json'),'utf8'));
            assert.equal(between.commit,original.commit);assert.equal(between.tree,original.tree);assert.equal(between.unchanged,true);
            const firstRoot=resolve(game,'output/gpu-duration-profile/observer-comparison/read-msaa/full/desktop');
            assert.equal(hash(await readFile(resolve(firstRoot,'observer-completion.json'))),between.laneEvidence.completionSha256,'Baseline completion proof changed during omission');
            assert.equal(hash(await readFile(resolve(firstRoot,'report.json'))),between.laneEvidence.reportSha256,'Baseline report changed during omission');
          }
          await writeFile(resolve(out,'source-integrity-'+stage+'.json'),JSON.stringify({commit:original.commit,tree:original.tree,laneEvidence,
            sourceFiles:sourceFiles.length,builtFiles:files.length,verifiedAt:new Date().toISOString(),unchanged:true,
            buildMetadata:{path:researchPath,sha256:hash(researchBytes),bytes:researchBytes.length,buildMs:JSON.parse(researchBytes).buildMs,unchangedSinceBuild:true}},null,2)+'\n');
          NODE
      - name: Retain all instrumented results and unchanged-limit failures
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          READ_MSAA_OUTCOME: ${{ steps.read_msaa.outcome }}
          INTEGRITY_BETWEEN_OUTCOME: ${{ steps.integrity_between.outcome }}
          OMIT_MSAA_OUTCOME: ${{ steps.omit_msaa.outcome }}
          INTEGRITY_AFTER_OUTCOME: ${{ steps.integrity_after.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,cpSync,mkdirSync} from 'node:fs';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {resolve,relative,sep} from 'node:path';
          const out=resolve('gpu-duration-evidence');mkdirSync(out,{recursive:true});
          for(const lane of ['read-msaa','omit-msaa']){
            const source=resolve(process.env.GAME_PATH,'output/gpu-duration-profile/observer-comparison',lane,'full/desktop');
            if(existsSync(source))cpSync(source,resolve(out,'gpu-duration/observer-comparison',lane,'full/desktop'),{recursive:true});
          }
          const outcomes=Object.fromEntries(['PREFLIGHT','BUILD','IDENTITY','BROWSER','READ_MSAA','INTEGRITY_BETWEEN','OMIT_MSAA','INTEGRITY_AFTER'].map(name=>[name.toLowerCase(),process.env[name+'_OUTCOME']??'unknown']));
          await writeFile(resolve(out,'step-outcomes.json'),JSON.stringify({commit:process.env.GITHUB_SHA,executionOrder:['read-msaa','omit-msaa'],sameBuild:true,outcomes,
            note:'Original step outcomes are retained. Each instrumented command retains all failures against the original limits; evidence collection never converts a failure to success or grants release acceptance.'},null,2)+'\n');
          const hashes=[];async function walk(directory){for(const entry of await readdir(directory,{withFileTypes:true})){
            const path=resolve(directory,entry.name);if(entry.isDirectory())await walk(path);else{
              if(!entry.isFile())throw Error('Unexpected evidence symlink/nonfile: '+path);
              const bytes=await readFile(path);hashes.push({path:relative(out,path).split(sep).join('/'),bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});
            }
          }}await walk(out);hashes.sort((a,b)=>a.path.localeCompare(b.path));
          await writeFile(resolve(out,'evidence-hashes.json'),JSON.stringify(hashes,null,2)+'\n');
          NODE
      - name: Preserve all original experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-native-gpu-duration-${{ github.sha }}
          path: gpu-duration-evidence/
          if-no-files-found: error
          retention-days: 14
