name: Belle Isle dialog-state browser regression

on:
  pull_request:
    paths:
      - '.github/workflows/belle-open-dialog-state.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/openDialogState.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/modalMeasurementBoundary.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/open-dialog-state-browser.mjs'

permissions:
  contents: read

jobs:
  native-dom-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/openDialogState.ts
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/modalMeasurementBoundary.ts
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/open-dialog-state-browser.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned browser test runtime
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compare synchronous dialog state with the native DOM
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: node scripts/open-dialog-state-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: belle-open-dialog-state-browser-regression
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/open-dialog-state/
          retention-days: 14
          if-no-files-found: warn
