name: PR 225 CPU-only native stack attribution (NOT RELEASE)
on:
  push:
    branches: [diagnostic/belle-225-native-operation-attribution-d4f4baa]
    paths: ['.github/workflows/belle-225-cpu-stack-attribution.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        bridge: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Build immutable candidate and bind the diagnostic marker
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          VITE_BRIDGE_BALUSTRADE_PREVIEW: ${{ matrix.bridge }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          test "$(git rev-parse 'HEAD^{tree}')" = 8754910f55ac44dd430cd5601d789c0d84d40e35
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          git diff HEAD --exit-code
          npm ci
          npm run check
          npm run build
          # The street generator writes elapsed wall-clock time into a tracked
          # research report. Preserve that evidence and allow ONLY that field.
          # Never ignore generated geometry, source, or any other tracked diff.
          python3 - <<'PY'
          import hashlib, json, math, re, subprocess
          from pathlib import Path
          root = Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip())
          rel = 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/research/street-detail-stats.json'
          changes = subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=no'], cwd=root, text=True).splitlines()
          assert changes in ([], [' M ' + rel]), changes
          before = subprocess.check_output(['git', 'show', 'HEAD:' + rel], cwd=root)
          after = (root / rel).read_bytes()
          pattern = rb'(?m)^  "buildMs": [0-9]+(?:\.[0-9]+)?,\r?$'
          assert len(re.findall(pattern, before)) == len(re.findall(pattern, after)) == 1
          assert re.sub(pattern, b'  "buildMs": ELAPSED,', before) == re.sub(pattern, b'  "buildMs": ELAPSED,', after), 'Non-timing report bytes changed'
          old, new = json.loads(before), json.loads(after)
          for stats in (old, new):
              value = stats.pop('buildMs')
              assert type(value) in (int, float) and math.isfinite(value) and value >= 0
          assert old == new, 'Street plan statistics changed'
          receipt = {'path': rel, 'onlyElapsedBuildMsMayDiffer': True, 'beforeSha256': hashlib.sha256(before).hexdigest(), 'afterSha256': hashlib.sha256(after).hexdigest(), 'before': json.loads(before), 'after': json.loads(after)}
          Path('dist/__belle_diagnostic_build_stats.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if changes:
              subprocess.run(['git', 'restore', '--worktree', '--', rel], cwd=root, check=True)
          assert (root / rel).read_bytes() == before
          PY
          git diff HEAD --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          node --input-type=module -e 'import {writeFileSync,readFileSync} from "node:fs";import {createHash} from "node:crypto";writeFileSync("dist/__belle_test_build.json",JSON.stringify({version:1,repository:"robjasper2084/Jungle-Lotto",pullRequest:225,commit:"d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c",buildId:"cpu-stack-diagnostic-"+process.env.GITHUB_RUN_ID+"-"+process.env.VITE_BRIDGE_BALUSTRADE_PREVIEW,builtAt:new Date().toISOString(),indexSha256:createHash("sha256").update(readFileSync("dist/index.html")).digest("hex"),profileQuery:"manual"}))'
          (cd dist && find . -type f -exec sha256sum {} \; | LC_ALL=C sort) > diagnostic-dist.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-stack-build-bridge-${{ matrix.bridge }}-NOT-RELEASE
          path: |
            lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
            lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/diagnostic-dist.sha256
          if-no-files-found: error
          retention-days: 2
  capture:
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        bridge: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: actions/download-artifact@v4
        with:
          name: cpu-stack-build-bridge-${{ matrix.bridge }}-NOT-RELEASE
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
      - name: Verify pinned original driver and immutable application build
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          test "$(git rev-parse 'HEAD^{tree}')" = 8754910f55ac44dd430cd5601d789c0d84d40e35
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          mkdir -p output/cpu-stack-attribution
          out=output/cpu-stack-attribution
          (cd dist && shasum -a 256 -c ../diagnostic-dist.sha256) > "$out/manifest-before.txt"
          cp diagnostic-dist.sha256 dist/__belle_test_build.json dist/__belle_diagnostic_build_stats.json "$out/"
          git rev-parse HEAD > "$out/source-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/source-tree.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/workflow-trigger-head.txt"
          cp scripts/sustained-ride-profile.mjs "$out/original-driver.mjs"
          cat > "$out/preload.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {resolve,dirname} from 'node:path';
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const game=resolve(dirname(process.argv[1]),'..');
          assert.equal(process.platform,'darwin');
          assert.equal(resolve(process.argv[1]),resolve(game,'scripts/sustained-ride-profile.mjs'));
          const out=resolve(game,'output/cpu-stack-attribution');
          await mkdir(out,{recursive:true});
          const {chromium}=createRequire(resolve(game,'../../package.json'))('@playwright/test');
          const evidence={diagnosticOnly:true,releaseAcceptance:false,applicationHead:process.env.DIAGNOSTIC_APPLICATION_SHA,workflowHead:process.env.GITHUB_SHA,bridgeExpected:process.env.DIAGNOSTIC_BRIDGE,intervalUs:1000,errors:[],scripts:[],arm:null,stop:null,coverage:null};
          const save=(name,value)=>writeFile(resolve(out,name),JSON.stringify(value,null,2)+'\n');
          const fail=(where,error)=>evidence.errors.push({where,error:String(error?.stack||error)});
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          let target,session,armed=false,stopping,finished=false;
          const pending=new Set(),seen=new Set();
          function syncAfter(owner,key,after){
           const native=owner[key]; owner[key]=function(...args){
            const result=Reflect.apply(native,this,args);
            try{after(result,args);}catch(error){fail(key,error);}
            return result;
           };
          }
          function asyncAfter(owner,key,after){
           const native=owner[key]; owner[key]=async function(...args){
            const result=await Reflect.apply(native,this,args);
            try{await after(result,args);}catch(error){fail(key,error);}
            return result;
           };
          }
          async function cdp(method,params={}){
           let timer;
           try{return await Promise.race([session.send(method,params),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(method+' observation timeout')),15000);})]);}
           finally{clearTimeout(timer);}
          }
          async function arm(){
           assert(!armed&&!evidence.arm,'Duplicate capture start');
           const checked=await target.locator('#bridge-stone-style').isChecked();
           assert.equal(checked,process.env.DIAGNOSTIC_BRIDGE==='1');
           evidence.arm={checked,hostMs:performance.now(),metricsBefore:await cdp('Performance.getMetrics')};
           await cdp('Profiler.start');armed=true;
           evidence.arm.readyHostMs=performance.now();
          }
          function stop(){
           if(stopping)return stopping;
           evidence.stop={hostMs:performance.now(),armed};
           stopping=(async()=>{
            if(!armed){fail('stop',Error('Profiler not armed'));return;}
            // Issue stop immediately on native W-keyup settlement, not after GPS.
            const result=await cdp('Profiler.stop');
            evidence.stop.profileReceivedHostMs=performance.now();
            const profile=result.profile;
            await save('renderer.cpuprofile',profile);
            evidence.stop.metricsAfter=await cdp('Performance.getMetrics');
            evidence.markers=await target.evaluate(()=>({timeOrigin:performance.timeOrigin,now:performance.now(),marks:window.__belleCpuStackMarks,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio}}));
            await cdp('Profiler.disable');
            evidence.cpu={startTime:profile.startTime,endTime:profile.endTime,samples:profile.samples?.length,nodes:profile.nodes?.length};
           })().catch(error=>fail('Profiler.stop/archive',error));
           return stopping;
          }
          async function finish(){
           if(finished)return;finished=true;
           if(!stopping)fail('finish',Error('Missing original W release'));
           await stopping;
           await Promise.allSettled([...pending]);
           if(!evidence.arm||!evidence.stop||!evidence.cpu||!evidence.scripts.length)fail('finish',Error('Missing CPU or source evidence'));
           await save('observer.json',evidence);
          }
          asyncAfter(chromium,'launch',async(browser,args)=>{
           assert.deepEqual(args,[{channel:'chrome',headless:false,args:['--enable-gpu','--use-gl=angle','--use-angle=metal']}]);
           const close=browser.close;
           browser.close=async function(...a){try{await finish();}catch(error){fail('finish',error);}return Reflect.apply(close,this,a);};
           asyncAfter(browser,'newPage',async(page,args)=>{
            if(args[0]?.viewport?.width!==1440||args[0]?.viewport?.height!==900)return;
            assert(!target,'Multiple desktop targets');
            assert.deepEqual(args,[{viewport:{width:1440,height:900},deviceScaleFactor:1,isMobile:false,hasTouch:false,reducedMotion:'reduce'}]);
            target=page;
            await page.addInitScript(()=>{
             if(location.hostname!=='127.0.0.1'||new URLSearchParams(location.search).get('profile')!=='1')return;
             const marks=[];Object.defineProperty(window,'__belleCpuStackMarks',{value:marks});
             const mark=label=>marks.push({label,atMs:performance.now()});
             document.addEventListener('click',e=>{if(e.isTrusted&&e.target?.closest('#ride-profile button')?.textContent?.startsWith('Start')&&!marks.length)mark('profile-start-click');},true);
             document.addEventListener('keydown',e=>{if(e.isTrusted&&e.code==='KeyW'&&marks.length&&!marks.some(m=>m.label==='first-w-keydown'))mark('first-w-keydown');},true);
             document.addEventListener('keyup',e=>{if(e.isTrusted&&e.code==='KeyW'&&marks.length&&!marks.some(m=>m.label==='w-keyup'))mark('w-keyup');},true);
            });
            page.on('response',response=>{
             const url=new URL(response.url());
             if(url.hostname!=='127.0.0.1'||!url.pathname.endsWith('.js')||seen.has(url.href))return;
             seen.add(url.href);
             const task=(async()=>{
              const rel=decodeURIComponent(url.pathname).slice(1),local=resolve(game,'dist',rel);
              assert(local.startsWith(resolve(game,'dist')+'/'));
              const bytes=await response.body(),expected=await readFile(local);
              assert.equal(response.status(),200);assert.equal(sha(bytes),sha(expected));
              const file='script-'+sha(bytes)+'.js';await writeFile(resolve(out,file),bytes);
              evidence.scripts.push({url:url.href,relativePath:rel,file,bytes:bytes.length,sha256:sha(bytes)});
             })().catch(error=>fail('script receipt',error));
             pending.add(task);task.finally(()=>pending.delete(task));
            });
            asyncAfter(page,'goto',async(_result,args)=>{
             assert.match(args[0],/^http:\/\/127\.0\.0\.1:\d+\/\?profile=1&locationPerf=1$/);
             session=await page.context().newCDPSession(page);
             await cdp('Performance.enable',{timeDomain:'timeTicks'});
             evidence.target=(await cdp('Target.getTargetInfo')).targetInfo;
             assert.equal(evidence.target.type,'page');assert.equal(evidence.target.url,args[0]);
             await cdp('Profiler.enable');await cdp('Profiler.setSamplingInterval',{interval:1000});
            });
            syncAfter(page,'locator',(panel,args)=>{
             if(args[0]!=='#ride-profile')return;
             syncAfter(panel,'getByRole',(button,roleArgs)=>{
              if(roleArgs[0]!=='button'||roleArgs[1]?.name!=='Start 10-minute capture'||roleArgs[1]?.exact)return;
              const click=button.click;
              button.click=async function(...a){try{await arm();}catch(error){fail('arm',error);}return Reflect.apply(click,this,a);};
             });
            });
            const up=page.keyboard.up;
            page.keyboard.up=function(...a){
             const result=Reflect.apply(up,this,a);
             if(a[0]==='w')Promise.resolve(result).then(()=>stop(),error=>fail('native keyup',error));
             return result;
            };
            const ctx=page.context(),close=ctx.close;
            ctx.close=async function(...a){try{await stopping;}catch(error){fail('context close',error);}return Reflect.apply(close,this,a);};
           });
          });
          JS
          cat > "$out/validate.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const out='output/cpu-stack-attribution';
          const read=async name=>JSON.parse(await readFile(out+'/'+name,'utf8'));
          const r=await read('original-report.json'),e=await read('observer.json'),p=await read('renderer.cpuprofile');
          const failures=[];
          function check(label,fn){try{fn();}catch(error){failures.push(label+': '+error.message);}}
          check('source/target',()=>{assert.equal(e.applicationHead,process.env.DIAGNOSTIC_APPLICATION_SHA);assert.equal(e.workflowHead,process.env.GITHUB_SHA);assert.equal(r.sourceHead,e.workflowHead);assert.equal(e.arm.checked,process.env.DIAGNOSTIC_BRIDGE==='1');assert.match(e.target.url,/profile=1&locationPerf=1$/);});
          check('native original report',()=>{assert.equal(r.renderBackend,'angle-metal');assert.match(r.actualGpu.renderer,/Metal/i);assert.equal(r.requestedSeconds,90);assert.equal(r.profile.stopReason,'trusted-W-keyup');assert.equal(r.profile.settingsAtStart.quality,'high');assert.equal(r.profile.settingsAtStart.diagnosticReduction,false);assert(r.input.keydowns>=1&&r.input.keyups>=1&&!r.input.heartbeatError);assert(r.profile.movingSeconds>=5&&r.profile.distanceMetres>=3);assert.equal(r.errors.length,0);assert.equal(r.failedRequests.length,0);});
          check('observer',()=>{assert.equal(e.errors.length,0);assert(e.scripts.length>0);assert.equal(e.intervalUs,1000);assert.deepEqual(e.markers.viewport,{width:1440,height:900,dpr:1});assert.deepEqual(e.markers.marks.map(x=>x.label),['profile-start-click','first-w-keydown','w-keyup']);assert(e.markers.marks[2].atMs-e.markers.marks[1].atMs>=90000);});
          check('sample structure',()=>{assert(p.nodes.length>0&&p.samples.length>0);assert.equal(p.samples.length,p.timeDeltas.length);assert(p.timeDeltas.every(Number.isFinite));assert(p.endTime>p.startTime);const ids=new Set(p.nodes.map(n=>n.id));assert(p.samples.every(id=>ids.has(id)));});
          const before=Object.fromEntries((e.arm?.metricsBefore?.metrics??[]).map(x=>[x.name,x.value])),after=Object.fromEntries((e.stop?.metricsAfter?.metrics??[]).map(x=>[x.name,x.value]));
          let t=p.startTime,min=Infinity,max=-Infinity;const counts=new Map();
          for(let i=0;i<p.samples.length;i++){t+=p.timeDeltas[i];min=Math.min(min,t);max=Math.max(max,t);counts.set(p.samples[i],(counts.get(p.samples[i])??0)+1);}
          const start=(before.NavigationStart+e.markers?.marks?.[1]?.atMs/1000)*1e6,end=(before.NavigationStart+e.markers?.marks?.[2]?.atMs/1000)*1e6;
          const clockComparable=Number.isFinite(start)&&Number.isFinite(end)&&before.NavigationStart===after.NavigationStart&&p.startTime>=before.Timestamp*1e6-100000&&p.endTime<=after.Timestamp*1e6+100000;
          const coversNativeWindow=clockComparable&&min<=start&&max>=end;
          check('sample boundary coverage',()=>assert(coversNativeWindow,'Native boundaries not covered by actual CPU samples; retain partial profile without extending ride'));
          for(const s of e.scripts){const bytes=await readFile(out+'/'+s.file);check('consumed script '+s.file,()=>{assert.equal(bytes.length,s.bytes);assert.equal(createHash('sha256').update(bytes).digest('hex'),s.sha256);});}
          const topSelfSamples=p.nodes.map(n=>({id:n.id,callFrame:n.callFrame,selfSamples:counts.get(n.id)??0})).sort((a,b)=>b.selfSamples-a.selfSamples).slice(0,60);
          const result={diagnosticOnly:true,releaseAcceptance:false,originalHarnessPassed:r.passed,collectionComplete:failures.length===0,failures,clockComparable,coversNativeWindow,firstSampleUs:min,lastSampleUs:max,nativeStartUs:start,nativeEndUs:end,negativeDeltas:p.timeDeltas.filter(x=>x<0).length,topSelfSamples,sourceMapping:'Generated script positions only; no source maps qualified. Self sample counts are not GPU time or inclusive duration.'};
          await writeFile(out+'/summary.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));if(failures.length)process.exitCode=1;
          JS
          node --check "$out/preload.mjs"
          node --check "$out/validate.mjs"
          git diff --exit-code
      - name: Install native Chrome and original driver dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Run original driver with external V8 sampler only
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
          DIAGNOSTIC_APPLICATION_SHA: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          DIAGNOSTIC_BRIDGE: ${{ matrix.bridge }}
        run: |
          set -euo pipefail
          out=output/cpu-stack-attribution
          status=0
          node --import "./$out/preload.mjs" scripts/sustained-ride-profile.mjs > "$out/driver.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/original-driver-exit.txt"
          cat "$out/driver.log"
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          (cd dist && shasum -a 256 -c ../diagnostic-dist.sha256) > "$out/manifest-after.txt"
          git diff --exit-code
          cp output/sustained-profile/full/desktop/report.json "$out/original-report.json"
          validation=0
          node "$out/validate.mjs" || validation=$?
          printf '%s\n' "$validation" > "$out/validator-exit.txt"
          # A nonzero original-driver exit always remains a failure, even if collection completed.
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-stack-attribution-bridge-${{ matrix.bridge }}-NOT-RELEASE
          path: |
            lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/cpu-stack-attribution/
            lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/sustained-profile/full/desktop/
          retention-days: 14
          if-no-files-found: warn
