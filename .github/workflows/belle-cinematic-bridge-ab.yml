name: Cinematic stone bridge real-game A/B (diagnostic only)
on:
  pull_request:
    branches: [feature/belle-isle-cinematic-stone-bridge-20261125]
    paths:
      - '.github/workflows/belle-cinematic-bridge-ab.yml'
      - '.github/diagnostics/belle-bridge-ab-driver.mjs'
permissions:
  contents: read
  actions: read
jobs:
  bridge-full-scene-ab:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5220c1a03f895b471ca933bdd81f02d2a414ecd6
          path: app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/diagnostics/belle-bridge-ab-driver.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          run-id: 45679987896
          github-token: ${{ github.token }}
          name: sustained-profile-game
          path: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
      - name: Pin unchanged game source, archived build and original strict driver
        run: |
          set -euo pipefail
          mkdir -p evidence
          game="$GITHUB_WORKSPACE/app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game"
          helper="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/belle-bridge-ab-driver.mjs"
          test "$(git -C app rev-parse HEAD)" = 5220c1a03f895b471ca933bdd81f02d2a414ecd6
          test "$(git -C app rev-parse 'HEAD^{tree}')" = a66d12d97a7f1dbbdf40e853bf80cff05049e443
          test "$(git hash-object "$game/scripts/sustained-ride-profile.mjs")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          test -s "$game/dist/index.html"
          (cd "$game/dist" && find . -type f -exec shasum -a 256 {} \; | LC_ALL=C sort) > evidence/build-before.sha256
          (cd "$game/../.." && npm ci && npx playwright install chrome)
          node --check "$helper"
          node "$helper" "$game/scripts/sustained-ride-profile.mjs" "$game/scripts/sustained-ride-bridge-ab.mjs" | tee evidence/derived-driver-receipt.json
          node --check "$game/scripts/sustained-ride-bridge-ab.mjs"
          cp "$game/scripts/sustained-ride-bridge-ab.mjs" evidence/derived-driver.mjs
          cp "$helper" evidence/driver-generator.mjs
          { date -u; sw_vers; uname -m; sysctl hw.model hw.ncpu hw.memsize; node -v; "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version; } > evidence/host.txt
          printf 'Same archived build; same macOS host; actual ON-OFF-OFF-ON input toggles from OFF baseline; exact original full desktop High 90-sec driver otherwise. Diagnostic only, not release acceptance.\n' > evidence/scope.txt
      - name: Counterbalanced ON-OFF-OFF-ON full-scene real Metal rides with unchanged gates
        timeout-minutes: 48
        working-directory: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = 5220c1a03f895b471ca933bdd81f02d2a414ecd6
          for lane in on-1 off-1 off-2 on-2; do
            mode="${lane%%-*}"
            export BELLE_STONE_BRIDGE_AB="$mode"
            status=0
            node scripts/sustained-ride-bridge-ab.mjs > "$GITHUB_WORKSPACE/evidence/$lane.log" 2>&1 || status=$?
            echo "$status" > "$GITHUB_WORKSPACE/evidence/$lane-exit.txt"
            cat "$GITHUB_WORKSPACE/evidence/$lane.log"
            dir=output/sustained-profile/full/desktop
            test -s "$dir/report.json"
            node --input-type=module - "$dir/report.json" "$mode" "$lane" <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const mode=process.argv[3],lane=process.argv[4];
          if(report.sourceHead!=='5220c1a03f895b471ca933bdd81f02d2a414ecd6'||report.mode!=='full'||report.device!=='desktop'||report.requestedSeconds!==90||report.renderBackend!=='angle-metal'||!/Metal/i.test(report.actualGpu?.renderer??'')||report.bridgeAB?.mode!==mode||report.bridgeAB?.uiChecked!==(mode==='on')||report.profile?.stopReason!=='trusted-W-keyup'||report.profile?.frames<8||!Number.isFinite(report.profile.metrics?.frameMs?.p95))throw Error('Unusable exact-source real-game bridge A/B run: '+mode);
          console.log(JSON.stringify({mode,lane,actualGpu:report.actualGpu.renderer,p95Ms:report.profile.metrics.frameMs.p95,over250Ms:report.profile.over250ms,drawCalls:report.profile.metrics.drawCalls?.mean,triangles:report.profile.metrics.triangles?.mean,exit:report.passed}));
          NODE
            mkdir -p "$GITHUB_WORKSPACE/evidence/$lane"
            cp "$dir/report.json" "$dir/riding-end.png" "$GITHUB_WORKSPACE/evidence/$lane/"
          done
          git diff --exit-code
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          (cd dist && find . -type f -exec shasum -a 256 {} \; | LC_ALL=C sort) > "$GITHUB_WORKSPACE/evidence/build-after.sha256"
          cmp "$GITHUB_WORKSPACE/evidence/build-before.sha256" "$GITHUB_WORKSPACE/evidence/build-after.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-bridge-on-off-full-scene-NOT-RELEASE
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
