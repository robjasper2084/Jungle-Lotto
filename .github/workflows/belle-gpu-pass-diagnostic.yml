name: Belle native GPU pass diagnosis

on:
  push:
    branches: [upgrade-redesign-gpu-timing-20261123]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-gpu-diagnosis-${{ github.ref }}
  cancel-in-progress: false

env:
  BASELINE_SHA: 41ee1d94b532ae4a31a6547261ebfd98ec79de44
  GAME_PATH: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
  RUNTIME_PATH: lottominded-ultra.io/games/gothtechnology2
  STRICT_SCRIPT_SHA256: c7bf025a63918b885bcd7e1bcda55865423aba73c63f58a8287ff9a03af1a100

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check test and build the exact diagnostic source
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          node --check scripts/manual-ride-diagnostic.mjs
          npm run build
      - name: Preserve complete source and build integrity
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile,mkdir,cp} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const game=process.cwd(),out=resolve(process.env.RUNNER_TEMP,'gpu-build'),hash=b=>createHash('sha256').update(b).digest('hex');
          const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();assert.equal(commit,process.env.GITHUB_SHA);
          const tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const sourceFiles=['scripts/sustained-ride-profile.mjs','scripts/manual-ride-diagnostic.mjs','scripts/coop-static-server.mjs','package-lock.json','../../package-lock.json',
            ...['main.ts','gpuRenderDiagnostics.ts','gpuFramePacing.ts','loopDiagnostics.ts','renderDiagnostics.ts','renderSubmissionDiagnostics.ts','rideProfile.ts','rideProfileStats.ts','rideProfileBuild.ts'].map(x=>'src/belle/'+x)];
          const sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>[path,hash(await readFile(resolve(game,path)))])));
          assert.equal(sources['scripts/sustained-ride-profile.mjs'],process.env.STRICT_SCRIPT_SHA256);
          const files=[];async function walk(dir){for(const entry of await readdir(dir,{withFileTypes:true})){
            const path=resolve(dir,entry.name);if(entry.isDirectory())await walk(path);else{assert(entry.isFile());const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});}
          }}await walk(resolve(game,'dist'));files.sort((a,b)=>a.path.localeCompare(b.path));
          const metadata={version:1,repository:'robjasper2084/Jungle-Lotto',label:'candidate',commit,tree,workflowCommit:process.env.GITHUB_SHA,
            buildId:'gpu-'+process.env.GITHUB_RUN_ID+'-'+commit,builtAt:new Date().toISOString(),node:process.version,sources,files};
          await mkdir(out,{recursive:true});await cp(resolve(game,'dist'),resolve(out,'dist'),{recursive:true});
          await writeFile(resolve(out,'manual-diagnostic-build.json'),JSON.stringify(metadata,null,2)+'\n');
          console.log(JSON.stringify({commit,tree,buildId:metadata.buildId,files:files.length,strictScriptSha256:sources['scripts/sustained-ride-profile.mjs']}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: belle-gpu-build-${{ github.sha }}
          path: ${{ runner.temp }}/gpu-build/
          if-no-files-found: error
          retention-days: 2

  gpu:
    name: Native Metal full scene GPU attribution
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: belle-gpu-build-${{ github.sha }}
          path: gpu-build
      - name: Install the existing Chrome runtime
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Observe 90 seconds of actual full quality riding
        timeout-minutes: 28
        run: |
          mkdir -p gpu-evidence
          node "$GAME_PATH/scripts/manual-ride-diagnostic.mjs" \
            --game "$GAME_PATH" --build gpu-build --output gpu-evidence/B1 \
            --sha "$GITHUB_SHA" --source candidate --case B1 --device desktop \
            --baseline "$BASELINE_SHA" --candidate "$GITHUB_SHA" --gpu
      - name: Preserve all GPU evidence and the original numeric failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-native-gpu-diagnostic-${{ github.sha }}
          path: gpu-evidence/
          if-no-files-found: warn
          retention-days: 14

  shader:
    name: Unchanged native shader pixel equivalence
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41ee1d94b532ae4a31a6547261ebfd98ec79de44
          path: baseline-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/atmosphereShaders.ts
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/physicalLighting.ts
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package-lock.json
      - uses: actions/checkout@v4
        with:
          path: candidate-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the exact dependencies and Chrome
        working-directory: candidate-source/lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npm ci --prefix belle-isle-source/game
          npx playwright install chrome
      - name: Require byte-identical shader pixels
        working-directory: candidate-source/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_SHADER_BASELINE: 41ee1d94b532ae4a31a6547261ebfd98ec79de44
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ github.workspace }}/baseline-source/.git/objects
        run: node scripts/render-shader-equivalence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: belle-native-shader-${{ github.sha }}
          path: candidate-source/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/shader-equivalence/
          if-no-files-found: warn
          retention-days: 14
