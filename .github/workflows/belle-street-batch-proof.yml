name: Belle Isle street batching pixel equivalence

on:
  pull_request:
    paths:
      - '.github/workflows/belle-street-batch-proof.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/streetDetails.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/staticArchitectureBatch.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/staticPaletteBatch.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/world.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/realisticMaterials.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/photoReferenceSurfaces.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/street-batch-pixel-proof.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-street-batch-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-pixels:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/street-batch-pixel-proof.mjs
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/public/belle/street-details.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/public/belle/street-details.bin
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/public/belle/skins/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the original locked runtimes and native Chrome
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
          cd belle-isle-source/game
          npm ci
      - name: Compare genuine color and shadow pixels with the original streets
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_STREET_BASE: '6518764b9735f78bdc95ec6227d0ba26ba291b48'
        run: node scripts/street-batch-pixel-proof.mjs
      - name: Retain original images, counts and any failed comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-street-batch-native-pixel-proof
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/street-batch-proof/
          if-no-files-found: error
          retention-days: 14
