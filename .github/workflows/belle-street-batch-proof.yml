name: Belle Isle street batch color and shadow equivalence

on:
  pull_request:
    paths:
      - '.github/workflows/belle-street-batch-proof.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-street-batch-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  STREET_BATCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  pixels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STREET_BATCH_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the existing locked browser and game dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          test "$(git rev-parse HEAD)" = "$STREET_BATCH_SOURCE_SHA"
          npm ci
          npx playwright install --with-deps chrome
          cd belle-isle-source/game
          npm ci
      - name: Compare actual street color and shadow pixels
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: node scripts/street-batch-native-proof.mjs
      - name: Preserve source receipts, real pixels, and submission counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-street-batch-pixels-${{ matrix.os }}-${{ env.STREET_BATCH_SOURCE_SHA }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/street-batch-proof/
          if-no-files-found: error
          retention-days: 14
