name: Cadillac current native named CPU attribution (diagnostic only)

on:
  pull_request:
    branches: [upgrade-redesign-cadillac-modification-suite]
    paths:
      - '.github/workflows/cadillac-current-native-cpu-attribution.yml'
      - '.github/diagnostics/cadillac-native-named/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cadillac-native-named-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75906273c0cd414c0d004320fc6f654b4783e5b1
          path: app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/
            /lottominded-ultra.io/games/gothtechnology2/swoop-source/src/
            /lottominded-ultra.io/games/gothtechnology2/swoop-source/public/exports/rigged-heroes/DS_Man_01.glb
            /lottominded-ultra.io/games/gothtechnology2/swoop-source/public/exports/rigged-heroes/DS_Hoodie_Woman_01.glb
            /lottominded-ultra.io/games/gothtechnology2/greater-detroit-world/src/
            /lottominded-ultra.io/games/gothtechnology2/greater-detroit-graphics/src/
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/diagnostics/cadillac-native-named/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin original source and apply only the archived diagnostic opt-in
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/cadillac-native-named"
          evidence="$GITHUB_WORKSPACE/evidence"
          game="$GITHUB_WORKSPACE/app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game"
          diagnostic_head="$(git -C diagnostic rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = 75906273c0cd414c0d004320fc6f654b4783e5b1
          test "$(git hash-object "$game/scripts/sustained-ride-profile.mjs")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          test "$(git hash-object "$bundle/observer-original.mjs")" = 007ef71a678d52e103492d5c4ecf74f38c3150af
          git -C app diff --exit-code
          git -C app apply --check "$bundle/application-diagnostic-only.patch"
          git -C app apply "$bundle/application-diagnostic-only.patch"
          node "$bundle/source-provenance.mjs" prepare "$GITHUB_WORKSPACE/app" "$bundle" "$evidence" "$diagnostic_head"
          git -C diagnostic cat-file -p HEAD > "$evidence/diagnostic-commit.txt"
          cp "$bundle/README.md" "$evidence/scope-and-integration.md"
          cp "$bundle/validate-named-submission.mjs" "$evidence/validate-named-submission.mjs"
      - name: Check diagnostic gates and make a fresh locked application build
        working-directory: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/cadillac-native-named"
          evidence="$GITHUB_WORKSPACE/evidence"
          export APP_GAME="$PWD" DIAGNOSTIC_SOURCE_ROOT="$PWD" STRICT_DRIVER_PATH="$PWD/scripts/sustained-ride-profile.mjs"
          npm ci
          node --test "$bundle/observer-derivation.test.mjs" "$bundle/render-probe-gate.test.mjs" "$bundle/source-provenance.test.mjs" 2>&1 | tee "$evidence/diagnostic-gates.log"
          npm run check 2>&1 | tee "$evidence/typecheck.log"
          node --check "$bundle/belle-cpu-observer.mjs"
          node --check "$bundle/validate-named-submission.mjs"
          node "$bundle/belle-cpu-observer.mjs" "$STRICT_DRIVER_PATH"
          node --check scripts/sustained-ride-cpu-diagnostic.mjs
          cp scripts/sustained-ride-cpu-diagnostic.mjs "$evidence/derived-driver.mjs"
          cp scripts/belle-cpu-observer.mjs "$evidence/observer.mjs"
          npm run build 2>&1 | tee "$evidence/build.log"
          node "$bundle/source-provenance.mjs" after-build "$GITHUB_WORKSPACE/app" "$bundle" "$evidence" "$(git -C "$GITHUB_WORKSPACE/diagnostic" rev-parse HEAD)"
          node "$bundle/source-provenance.mjs" manifest-write "$PWD/dist" "$evidence/dist-build-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cadillac-native-named-diagnostic-game-NOT-RELEASE
          path: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadillac-native-named-source-receipts-NOT-RELEASE
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

  cpu-attribution:
    needs: build-diagnostic
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75906273c0cd414c0d004320fc6f654b4783e5b1
          path: app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/diagnostics/cadillac-native-named/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: cadillac-native-named-diagnostic-game-NOT-RELEASE
          path: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist
      - uses: actions/download-artifact@v4
        with:
          name: cadillac-native-named-source-receipts-NOT-RELEASE
          path: evidence
      - name: Verify the fresh diagnostic build and derive a separate observed driver
        run: |
          set -euo pipefail
          game="$GITHUB_WORKSPACE/app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game"
          bundle="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/cadillac-native-named"
          evidence="$GITHUB_WORKSPACE/evidence"
          test "$(git -C app rev-parse HEAD)" = 75906273c0cd414c0d004320fc6f654b4783e5b1
          test "$(git hash-object "$game/scripts/sustained-ride-profile.mjs")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          cmp "$game/scripts/sustained-ride-profile.mjs" "$evidence/original-strict-driver.mjs"
          cmp "$bundle/application-diagnostic-only.patch" "$evidence/reviewed-application.patch"
          cmp "$bundle/source-receipts.json" "$evidence/reviewed-source-receipts.json"
          cmp "$bundle/runtime-assets.json" "$evidence/reviewed-runtime-assets.json"
          node --input-type=module -e 'import assert from "node:assert/strict";import {readFileSync} from "node:fs";const r=JSON.parse(readFileSync(process.argv[1]));assert.equal(r.applicationBase,"75906273c0cd414c0d004320fc6f654b4783e5b1");assert.equal(r.diagnosticRevision,process.argv[2]);assert.match(r.applicationSourceTree,/^[0-9a-f]{40}$/);assert.equal(r.strictDriverGitBlob,"c722b5810a7693e5ece72ed00b4401e7cde7267a");' "$evidence/source-provenance.json" "$(git -C diagnostic rev-parse HEAD)"
          node "$bundle/source-provenance.mjs" manifest-check "$game/dist" "$evidence/dist-build-manifest.json"
          (cd "$game/../.." && npm ci && npx playwright install chrome)
          node "$bundle/belle-cpu-observer.mjs" "$game/scripts/sustained-ride-profile.mjs"
          node --check "$game/scripts/sustained-ride-cpu-diagnostic.mjs"
          cmp "$game/scripts/sustained-ride-cpu-diagnostic.mjs" "$evidence/derived-driver.mjs"
          cmp "$game/scripts/belle-cpu-observer.mjs" "$evidence/observer.mjs"
          git -C app diff --exit-code
          { date -u; sw_vers; uname -m; sysctl hw.model hw.ncpu hw.memsize; node -v; "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version; uptime; vm_stat; } > "$evidence/host-before.txt"
      - name: Capture named draws and V8 samples during the unchanged full native ride
        timeout-minutes: 28
        working-directory: app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/cadillac-native-named"
          target="$GITHUB_WORKSPACE/evidence"
          export GITHUB_SHA="$(git -C "$GITHUB_WORKSPACE/diagnostic" rev-parse HEAD)"
          status=0
          node scripts/sustained-ride-cpu-diagnostic.mjs > "$target/profiled-driver.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$target/profiled-driver-exit.txt"
          cat "$target/profiled-driver.log"
          { date -u; uptime; vm_stat; } > "$target/host-after.txt"
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          cmp scripts/sustained-ride-profile.mjs "$target/original-strict-driver.mjs"
          node "$bundle/source-provenance.mjs" manifest-check "$PWD/dist" "$target/dist-build-manifest.json"
          git diff --exit-code
          report=output/sustained-profile/full/desktop
          test -s "$report/report.json"
          test -s "$report/renderer.cpuprofile"
          test -s "$report/renderer-profile-summary.json"
          test -s "$report/cpu-diagnostic.json"
          node "$bundle/validate-named-submission.mjs" "$report/report.json" "$GITHUB_SHA" > "$target/named-submission-evidence.json"
          node --input-type=module -e 'import assert from "node:assert/strict";import {readFileSync} from "node:fs";const c=JSON.parse(readFileSync(process.argv[1]));const d=JSON.parse(readFileSync(process.argv[2]));assert(Array.isArray(c.samples)&&c.samples.length>0);assert.equal(d.profileQuery,"1");assert.equal(d.renderSubmissionQuery,"1");assert(Number.isFinite(d.inputDownReturnedMs)&&Number.isFinite(d.inputUpReturnedMs));assert(d.inputUpReturnedMs-d.inputDownReturnedMs>=90000);' "$report/renderer.cpuprofile" "$report/cpu-diagnostic.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadillac-current-native-named-cpu-attribution-NOT-RELEASE
          path: |
            evidence/
            app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/sustained-profile/full/desktop/
          retention-days: 14
          if-no-files-found: warn
