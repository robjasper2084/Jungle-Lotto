name: Belle Isle anti-aliasing A/B comparison

on:
  pull_request:
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/antiAliasingPolicy*'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/aa-browser-comparison.mjs'
      - '.github/workflows/belle-aa-comparison.yml'
permissions:
  contents: read
concurrency:
  group: belle-aa-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build exact Belle Isle candidate
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm run build
      - name: Install existing Playwright browser
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Capture On vs Off hoverbike race and frame pacing
        timeout-minutes: 40
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          AA_COMPARE_DEVICE: ${{ matrix.device }}
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" node scripts/aa-browser-comparison.mjs
      - name: Save paired screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-aa-comparison-${{ matrix.device }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/aa-comparison/${{ matrix.device }}
          if-no-files-found: warn
          retention-days: 14
