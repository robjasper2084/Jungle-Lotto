name: Belle Isle shared geometry and uniform cache diagnostic

on:
  push:
    branches: ['upgrade-redesign-surface-fragments-*']
  pull_request:
    paths:
      - '.github/workflows/belle-shared-geometry-proof.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/shared-geometry-*.mjs'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/shared-geometry-*.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/shadowMatrixCache*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-shared-geometry-proof-${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
  cancel-in-progress: true

env:
  SHARED_GEOMETRY_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SHARED_GEOMETRY_PROOF_BASELINE_SHA: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c

jobs:
  original-world-diagnostic:
    name: Original world pixels and native timings (${{ matrix.os }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: [
          {"os":"ubuntu-latest","partition":"linux-a","cases":["jefferson-day","jefferson-night","island-day"]},
          {"os":"ubuntu-latest","partition":"linux-b","cases":["island-night","conservatory-day","conservatory-night"]},
          {"os":"macos-15","partition":"all","cases":["jefferson-day","jefferson-night","island-day","island-night","conservatory-day","conservatory-night"]}
        ]
    env:
      SHARED_GEOMETRY_PROOF_PARTITION: ${{ matrix.partition }}
      SHARED_GEOMETRY_PROOF_MATRIX_CASES: ${{ toJSON(matrix.cases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHARED_GEOMETRY_PROOF_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.github/workflows/belle-shared-geometry-proof.yml
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact source and fetch the immutable full-world baseline
        run: |
          test "$(git rev-parse HEAD)" = "$SHARED_GEOMETRY_PROOF_SOURCE_SHA"
          git fetch --filter=blob:none --no-tags --depth=1 origin "$SHARED_GEOMETRY_PROOF_BASELINE_SHA"
      - name: Install locked browser and game dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chrome
          cd belle-isle-source/game
          npm ci
      - name: Verify the original buffer and exact uniform-upload contracts
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          node --test src/belle/sharedGeometryBuffers.test.mjs src/belle/shadowMatrixCache.test.mjs
          node scripts/shared-geometry-native-proof.mjs --self-test
      - name: Compare full-world RGBA and collect balanced native measurements
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: node scripts/shared-geometry-native-proof.mjs
      - name: Preserve source, immutable assets, linked shaders, pixels and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-shared-geometry-${{ matrix.os }}-${{ matrix.partition }}-${{ env.SHARED_GEOMETRY_PROOF_SOURCE_SHA }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/shared-geometry-proof/
          if-no-files-found: error
          retention-days: 14
