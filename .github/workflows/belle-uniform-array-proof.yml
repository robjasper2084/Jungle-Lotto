name: Belle Isle direct shadow uniform diagnostic

on:
  push:
    branches: ['upgrade-redesign-surface-fragments-*']
  pull_request:
    paths:
      - '.github/workflows/belle-uniform-array-proof.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/uniform-array-*'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/three-shadow-uniform-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-uniform-array-proof-${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
  cancel-in-progress: true

env:
  UNIFORM_ARRAY_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  UNIFORM_ARRAY_PROOF_BASELINE_SHA: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c

jobs:
  original-world-diagnostic:
    name: Direct shadow uniforms, exact pixels and native timing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UNIFORM_ARRAY_PROOF_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.github/workflows/belle-uniform-array-proof.yml
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact source and fetch the immutable full-world baseline
        run: |
          test "$(git rev-parse HEAD)" = "$UNIFORM_ARRAY_PROOF_SOURCE_SHA"
          git fetch --filter=blob:none --no-tags --depth=1 origin "$UNIFORM_ARRAY_PROOF_BASELINE_SHA"
      - name: Install locked browser and game dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chrome
          cd belle-isle-source/game
          npm ci
      - name: Verify pinned transformation and original uniform semantics
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          node --test scripts/three-shadow-uniform-transform.test.mjs
          node scripts/uniform-array-native-proof.mjs --self-test
      - name: Compare exact full-world pixels and collect balanced native samples
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: node scripts/uniform-array-native-proof.mjs
      - name: Preserve source, transformed setter, linked shaders, pixels and every timing sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-uniform-array-${{ matrix.os }}-${{ env.UNIFORM_ARRAY_PROOF_SOURCE_SHA }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/uniform-array-proof/
          if-no-files-found: error
          retention-days: 14
