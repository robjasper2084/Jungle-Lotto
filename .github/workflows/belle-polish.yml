name: Belle Isle polish review

on:
  pull_request:
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/**'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/tools/**'
      - '.github/workflows/belle-polish.yml'

permissions:
  contents: read

concurrency:
  group: belle-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polish-visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [desktop, phone]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            lottominded-ultra.io/games/gothtechnology2/package-lock.json
            lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package-lock.json
      - name: Build Belle Isle polish candidate
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 144 && matrix.case == 'phone') }}
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run build
      - name: Install the existing browser test runtime
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 144 && matrix.case == 'phone') }}
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify restart input, route feedback and responsive HUD
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 144 && matrix.case == 'phone') }}
        # A 35-minute case plus bounded failure capture and browser cleanup.
        timeout-minutes: 40
        working-directory: lottominded-ultra.io/games/gothtechnology2
        env:
          BELLE_POLISH_BROWSER_HEADED: '1'
          BELLE_POLISH_BROWSER_CASE: ${{ matrix.case }}
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" node belle-isle-source/game/scripts/polish-browser-smoke.mjs
      - name: Explicit PR 144 phone-only visual waiver
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 144 && matrix.case == 'phone' }}
        run: |
          echo "::warning title=Phone-only visual QA waived::This PR's phone-only visual smoke was explicitly waived; no phone pass is claimed. Desktop safety checks still run."
          echo "Phone-only visual QA WAIVED for PR #144, not passed; retain it for every other PR." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload polish visual review and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-isle-polish-visual-${{ matrix.case }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/polish-browser
          if-no-files-found: warn
          retention-days: 14
