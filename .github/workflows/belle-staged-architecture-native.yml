name: Belle Isle staged architecture native validation

on:
  pull_request:
    paths:
      - '.github/workflows/belle-staged-architecture-native.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/stagedLandmarkStudies*'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src/belle/world.ts'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/public/belle/staged-architecture/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-staged-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staged:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Typecheck, run the full suite, and build the opt-in staged scene
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          VITE_STAGED_BELLE_ARCHITECTURE: '1'
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Independently verify all twelve staged GLBs in the exact dist
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          const base='dist/belle/staged-architecture/';
          const manifest=JSON.parse(await readFile(base+'manifest.json','utf8'));
          if(manifest.productionReady!==false||manifest.models.length!==4)throw Error('Staging manifest contract changed');
          let count=0;
          for(const site of manifest.models)for(const lod of site.lods){
            const bytes=await readFile(base+lod.file);
            if(bytes.length!==lod.bytes||createHash('sha256').update(bytes).digest('hex')!==lod.sha256)throw Error('dist asset hash mismatch: '+lod.file);
            count++;
          }
          if(count!==12)throw Error('Expected twelve exact GLBs');
          console.log('All 12 staged GLB bytes verified in built artifact');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: belle-staged-architecture-verified-build
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
          if-no-files-found: error
          retention-days: 14
  native-full-scene:
    needs: build-staged
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: belle-staged-architecture-verified-build
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
      - name: Install native Chrome and Playwright
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Keep genuine input and original strict ninety-second full-scene thresholds
        timeout-minutes: 28
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: ${{ matrix.device }}
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: node scripts/sustained-ride-profile.mjs
      - name: Preserve original numerical failures and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-staged-native-full-${{ matrix.device }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/sustained-profile/full/${{ matrix.device }}
          if-no-files-found: warn
          retention-days: 14
