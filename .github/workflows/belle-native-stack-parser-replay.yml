# Offline diagnostic regression only. This job never starts Chrome or macOS sample.
name: Belle Isle native stack parser offline replay

on:
  pull_request:
    paths:
      - '.github/workflows/belle-native-stack-parser-replay.yml'
      - '.github/diagnostics/belle-full-preview-p95/**'

permissions:
  contents: read

concurrency:
  group: belle-native-stack-parser-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-parser-regression:
    if: >-
      github.head_ref == 'upgrade-redesign-perf-278-offline-parser-20261127' &&
      github.base_ref == 'upgrade-redesign-perf-268-native-stacks-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/diagnostics/belle-full-preview-p95/
            /.github/workflows/belle-native-stack-parser-replay.yml
      - name: Read the pinned original harness fixtures
        uses: actions/checkout@v4
        with:
          ref: 9d2162e39188dcd0e42565f398b736734e481f73
          path: app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/sustained-ride-profile.mjs
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/gps-full-scene-check.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify unchanged harness and run offline diagnostic regressions
        env:
          DIAGNOSTIC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          game="$GITHUB_WORKSPACE/app/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game"
          bundle="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/belle-full-preview-p95"
          test "$(git -C diagnostic rev-parse HEAD)" = "$DIAGNOSTIC_EXPECTED_HEAD"
          test "$(git -C app rev-parse HEAD)" = 9d2162e39188dcd0e42565f398b736734e481f73
          test "$(git -C app rev-parse HEAD^{tree})" = 5a7f56b36477b615b96b5e19094c3d11d9a4c6cf
          test "$(git hash-object "$game/scripts/sustained-ride-profile.mjs")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          test "$(git hash-object "$game/scripts/gps-full-scene-check.mjs")" = 1ef56565ceb8892fb918a6848972ea8b9f37c2fd
          git -C app diff --exit-code
          git -C diagnostic diff --exit-code
          export STRICT_DRIVER_PATH="$game/scripts/sustained-ride-profile.mjs"
          export STRICT_GPS_PATH="$game/scripts/gps-full-scene-check.mjs"
          node --test "$bundle/full-mode.test.mjs" "$bundle/native-gpu-input.test.mjs" "$bundle/native-gpu-sample.test.mjs" "$bundle/native-gpu-identity.test.mjs" "$bundle/native-gpu-parser.test.mjs" "$bundle/embedded-assets.test.mjs" "$bundle/asset-receipts.test.mjs" "$bundle/upstream/observer.test.mjs" "$bundle/upstream/sustained-trace-json.test.mjs" "$bundle/upstream/source.test.mjs"
          node --check "$bundle/preload.mjs"
          node --check "$bundle/validate-evidence.mjs"
          git -C app diff --exit-code
          git -C diagnostic diff --exit-code
