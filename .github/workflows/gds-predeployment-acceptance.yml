name: Greater Detroit predeployment acceptance

on:
  pull_request:
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/greater-detroit-graphics/**'
      - '.github/workflows/gds-predeployment-acceptance.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  acceptance:
    name: gds-acceptance-exact-head
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the fail-closed acceptance checks
        working-directory: lottominded-ultra.io/games/gothtechnology2/greater-detroit-graphics
        run: node --test tests/acceptanceGate.test.mjs tests/evidenceArtifact.test.mjs
      - name: Find the trusted device evidence for this candidate
        id: evidence
        working-directory: lottominded-ultra.io/games/gothtechnology2/greater-detroit-graphics
        env:
          GDS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GDS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GDS_EVIDENCE_WORKFLOW_ID: ${{ vars.GDS_EVIDENCE_WORKFLOW_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolveEvidenceArtifact.mjs
      - name: Download the verified evidence artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact-id }}
          run-id: ${{ steps.evidence.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gds-evidence
          digest-mismatch: error
      - name: Verify actual real-game evidence and peer approval
        if: ${{ !cancelled() }}
        working-directory: lottominded-ultra.io/games/gothtechnology2/greater-detroit-graphics
        env:
          GDS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GDS_PR_NUMBER: ${{ github.event.pull_request.number }}
          GDS_EVIDENCE_MANIFEST: ${{ runner.temp }}/gds-evidence/manifest.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verifyAcceptance.mjs
