name: PR149 audio lifecycle and current-render diagnostic
on:
  push:
    branches: [diagnostics/pr149-music-abort-20261114]
permissions:
  contents: read
jobs:
  strict-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Reserve full checkout disk
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict TypeScript, all registered game regressions and build
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Preserve exact-source and no-modification evidence
        run: |
          git diff --exit-code -- lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/src lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts scripts/belle-cinematic-browser-smoke.mjs
  cinematic-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [desktop, compact-landscape, small-phone]
    steps:
      - name: Reserve disk
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict game check and actual candidate build
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          node --test src/belle/musicGesture.test.mjs scripts/preview-media-server.test.mjs scripts/preview-media-cache.test.mjs scripts/cinematic-render-proof.test.mjs
          npm run build
      - name: Install same Chrome browser runtime as PR
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chrome
      - name: Original real-game cinematic acceptance, no relaxed deadlines or errors
        timeout-minutes: 25
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          BELLE_GAME_URL: http://127.0.0.1:8301/
          BELLE_CINEMATIC_CASE: ${{ matrix.case }}
          BELLE_CINEMATIC_OUTPUT: artifacts/belle-cinematic
          BELLE_BROWSER_HEADED: '1'
        run: |
          npm --prefix lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game run preview > /tmp/belle-preview.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8301/ > /dev/null && break; sleep 1; done
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" node scripts/belle-cinematic-browser-smoke.mjs
      - name: Preserve full screenshot, trace, fixture logs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr149-audio-${{ matrix.case }}-${{ github.run_id }}
          path: |
            artifacts/belle-cinematic/
            /tmp/belle-preview.log
          retention-days: 7
          if-no-files-found: warn
