name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/**'
      - 'scripts/*pages*.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lottominded-ultra.io/games/gothtechnology2/package-lock.json
      - name: Install GothTechnology dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: npm ci
      - name: Validate and build GothTechnology storefront
        working-directory: lottominded-ultra.io/games/gothtechnology2
        env:
          PUBLIC_COMMERCE_MODE: demo
          PUBLIC_LAUNCH_APPROVED: 'false'
        run: |
          npm run check:store
          npm run test:store
          npm run check
          npm run test:unit
          npm run build
      - name: Install browser for storefront regressions
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: npx playwright install --with-deps chromium
      - name: Verify game portal, artwork and video controls
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: npm run test:store:browser -- --project=desktop --grep "game portal|homepage category tile|every signal column|inline Lookbook films|reduced motion keeps inline films"
      - name: Validate Pages assembly
        run: node --test scripts/gothtechnology-pages.test.mjs
      - name: Build lean Pages artifact
        run: node scripts/build-pages-artifact.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
