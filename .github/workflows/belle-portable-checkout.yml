name: Belle Isle portable exact-source checkout (diagnostic only)
on:
  pull_request:
    branches: [upgrade-redesign-cadillac-modification-suite]
    paths:
      - '.github/workflows/belle-portable-checkout.yml'
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.ref == 'diagnostic/belle-isle-offline-checkout-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: '7e6c5c7d9f8ed36ee97982b925daa6703e9a9b3e'
      SOURCE_TREE: '9dbc2c14c58aee6228afa503f847feb19f143624'
      RUNTIME: lottominded-ultra.io/games/gothtechnology2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: checkout
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.github/workflows/
            /lottominded-ultra.io/games/gothtechnology2/
      - name: Export a real shallow sparse Git checkout and prove offline restoration
        id: export
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/recovery"
          mkdir -p "$out/source" "$out/meta"
          cd "$GITHUB_WORKSPACE/checkout"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git rev-parse --is-shallow-repository)" = true
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f AGENTS.md
          test -f "$RUNTIME/package-lock.json"
          test -f "$RUNTIME/belle-isle-source/game/package-lock.json"
          git switch -c upgrade-redesign
          case "$(git remote get-url origin)" in
            https://github.com/robjasper2084/Jungle-Lotto|https://github.com/robjasper2084/Jungle-Lotto.git) ;;
            *) echo "Unexpected origin"; exit 1;;
          esac
          # Fail closed if credential-related settings or external object stores exist.
          if { git config --local --name-only --list; git config --worktree --name-only --list; } | grep -Ei 'credential|extraheader|(^|\.)include|^url\.|proxy|auth|token'; then
            echo "Unexpected credential or external configuration key"; exit 1
          fi
          test ! -e .git/objects/info/alternates
          test ! -e .git/objects/info/http-alternates
          test ! -e .git/worktrees
          git ls-files --stage | sha256sum | cut -d' ' -f1 > "$out/meta/index.sha256"
          archive="$RUNNER_TEMP/belle-git.tar"
          tar --exclude=.git/hooks --exclude=.git/logs --exclude=.git/FETCH_HEAD -cf "$archive" .git
          restore="$RUNNER_TEMP/belle-offline-proof"
          mkdir "$restore"
          tar -xf "$archive" -C "$restore"
          (
            cd "$restore"
            export GIT_ALLOW_PROTOCOL=none GIT_NO_LAZY_FETCH=1
            git checkout-index -a
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
            test "$(git branch --show-current)" = upgrade-redesign
            test -z "$(git status --porcelain --untracked-files=all)"
            test "$(git ls-files --stage | sha256sum | cut -d' ' -f1)" = "$(cat "$out/meta/index.sha256")"
            test -f AGENTS.md
            test -f "$RUNTIME/belle-isle-source/game/package-lock.json"
          )
          rm -rf "$restore"
          sha256sum "$archive" | cut -d' ' -f1 > "$out/meta/repository.tar.sha256"
          split -b 128M -d -a 2 "$archive" "$out/source/repo.part."
          rm "$archive"
          cd "$out/source"
          shopt -s nullglob
          parts=(repo.part.*)
          test "${#parts[@]}" -ge 1
          test "${#parts[@]}" -le 32
          sha256sum "${parts[@]}" > "$out/meta/repo-parts.sha256"
          printf 'source=%s\ntree=%s\nparts=%s\nverifiedOfflineRestore=true\n' "$SOURCE_SHA" "$SOURCE_TREE" "${#parts[@]}" > "$out/meta/source-receipt.txt"
          git --version >> "$out/meta/source-receipt.txt"
          printf 'parts=%s\n' "${#parts[@]}" >> "$GITHUB_OUTPUT"
          cat "$out/meta/source-receipt.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: belle-offline-source-metadata-7e6c5c7
          path: recovery/meta/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.export.outputs.parts) > 0 }}
        with:
          name: belle-offline-source-7e6c5c7-part-00
          path: recovery/source/repo.part.00
          if-no-files-found: error
