      - name: Prepare the existing locked Linux dependencies and Node toolchain
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/recovery"
          mkdir -p "$out/deps" "$out/deps-meta"
          cd "$GITHUB_WORKSPACE/checkout/$RUNTIME"
          npm ci
          cd belle-isle-source/game
          npm ci
          cd "$GITHUB_WORKSPACE/checkout"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD
          test -d "$RUNTIME/node_modules"
          test -d "$RUNTIME/belle-isle-source/game/node_modules"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/belle-deps.tar.zst" "$RUNTIME/node_modules" "$RUNTIME/belle-isle-source/game/node_modules"
          sha256sum "$RUNNER_TEMP/belle-deps.tar.zst" | cut -d' ' -f1 > "$out/deps-meta/dependencies.tar.zst.sha256"
          split -b 128M -d -a 2 "$RUNNER_TEMP/belle-deps.tar.zst" "$out/deps/deps.part."
          rm "$RUNNER_TEMP/belle-deps.tar.zst"
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          test -x "$node_root/bin/node"
          tar -I 'zstd -T0 -3' -cf "$out/deps-meta/node-toolchain.tar.zst" -C "$node_root" .
          (cd "$out/deps-meta"; sha256sum node-toolchain.tar.zst > node-toolchain.sha256; node --version > node-version.txt; npm --version > npm-version.txt; uname -sm > platform.txt)
          cd "$out/deps"
          shopt -s nullglob
          parts=(deps.part.*)
          test "${#parts[@]}" -ge 1
          test "${#parts[@]}" -le 8
          sha256sum "${parts[@]}" > "$out/deps-meta/deps-parts.sha256"
