name: Belle Isle PR141 reference evidence
on:
  push:
    branches: ['review/belle-pr141-reference-a9b6b4d']
permissions:
  contents: read
jobs:
  reference-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install unchanged locked game dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: npm ci
      - name: Package pinned source and focused test dependencies
        run: |
          mkdir -p output/source-review
          git rev-parse HEAD > output/source-review/review-commit.txt
          git rev-parse a9b6b4d1fd7c8b529a7052843797101dbee6f614:lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game > output/source-review/candidate-game-tree.txt
          tar -czf output/source-review/belle-source-tests.tar.gz -C lottominded-ultra.io/games/gothtechnology2/belle-isle-source game/src game/runtime game/node_modules game/scripts game/package.json game/package-lock.json game/tsconfig.json game/vite.config.ts game/index.html game/run-tests.mjs game/public/belle/map.json game/public/belle/nature/manifest.json game/public/belle/nature/placements.json tools
          sha256sum output/source-review/belle-source-tests.tar.gz > output/source-review/SHA256SUMS.txt
      - name: Preserve scoped source fixture
        uses: actions/upload-artifact@v4
        with:
          name: pr141-pinned-source-tests
          path: output/source-review
          retention-days: 7
      - name: Install existing browser test runtime
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Render original world at documented aerial sunset views
        run: xvfb-run --auto-servernum --server-args="-screen 0 1200x1200x24" node scripts/belle-reference-audit.mjs
      - name: Preserve supplemental visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr141-a9b6b4d-reference-evidence
          path: output/belle-reference-audit
          if-no-files-found: warn
          retention-days: 7
