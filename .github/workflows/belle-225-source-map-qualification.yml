name: PR 225 byte-identical source map qualification (NOT RELEASE)
on:
  push:
    branches: ['diagnostic/belle-225-byte-identical-source-maps-d4f4baa']
    paths: ['.github/workflows/belle-225-source-map-qualification.yml']
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bridge: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: actions/download-artifact@v4
        with:
          name: cpu-stack-attribution-bridge-${{ matrix.bridge }}-NOT-RELEASE
          run-id: 45982893169
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-profile
      - name: Rebuild pinned source and generate hidden maps only
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          VITE_BRIDGE_BALUSTRADE_PREVIEW: ${{ matrix.bridge }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c
          test "$(git rev-parse 'HEAD^{tree}')" = 8754910f55ac44dd430cd5601d789c0d84d40e35
          test "$(git hash-object scripts/sustained-ride-profile.mjs)" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          git diff HEAD --exit-code
          mkdir -p "$RUNNER_TEMP/map-evidence"
          npm ci
          npm run check
          npm run build
          # The street generator writes elapsed wall-clock time into a tracked
          # research report. Preserve that evidence and allow ONLY that field.
          # Never ignore generated geometry, source, or any other tracked diff.
          python3 - <<'PY'
          import hashlib, json, math, re, subprocess
          from pathlib import Path
          root = Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip())
          rel = 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/research/street-detail-stats.json'
          changes = subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=no'], cwd=root, text=True).splitlines()
          assert changes in ([], [' M ' + rel]), changes
          before = subprocess.check_output(['git', 'show', 'HEAD:' + rel], cwd=root)
          after = (root / rel).read_bytes()
          pattern = rb'(?m)^  "buildMs": [0-9]+(?:\.[0-9]+)?,\r?$'
          assert len(re.findall(pattern, before)) == len(re.findall(pattern, after)) == 1
          assert re.sub(pattern, b'  "buildMs": ELAPSED,', before) == re.sub(pattern, b'  "buildMs": ELAPSED,', after), 'Non-timing report bytes changed'
          old, new = json.loads(before), json.loads(after)
          for stats in (old, new):
              value = stats.pop('buildMs')
              assert type(value) in (int, float) and math.isfinite(value) and value >= 0
          assert old == new, 'Street plan statistics changed'
          receipt = {'path': rel, 'onlyElapsedBuildMsMayDiffer': True, 'beforeSha256': hashlib.sha256(before).hexdigest(), 'afterSha256': hashlib.sha256(after).hexdigest(), 'before': json.loads(before), 'after': json.loads(after)}
          Path('dist/__belle_diagnostic_build_stats.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if changes:
              subprocess.run(['git', 'restore', '--worktree', '--', rel], cwd=root, check=True)
          assert (root / rel).read_bytes() == before
          PY
          git diff HEAD --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          cp dist/__belle_diagnostic_build_stats.json "$RUNNER_TEMP/map-evidence/"
          mv dist "$RUNNER_TEMP/normal-dist"
          npm exec -- vite build --sourcemap hidden
          node ../tools/pack-landmarks.mjs
          node ../tools/pack-startup-assets.mjs
          git diff HEAD --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Resolve sampled positions only after exact JS equality
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          VITE_BRIDGE_BALUSTRADE_PREVIEW: ${{ matrix.bridge }}
        run: |
          set -euo pipefail
          export PROFILE_DIR="$(dirname "$(find "$RUNNER_TEMP/original-profile" -name observer.json -type f -print)")"
          test -f "$PROFILE_DIR/observer.json"
          cat > "$RUNNER_TEMP/qualify.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,copyFile,mkdir} from 'node:fs/promises';
          import {resolve,basename,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          import {SourceMap} from 'node:module';
          const dir=process.env.PROFILE_DIR,out=process.env.RUNNER_TEMP+'/map-evidence';
          const read=async n=>JSON.parse(await readFile(resolve(dir,n),'utf8'));
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const e=await read('observer.json'),p=await read('renderer.cpuprofile'),s=await read('summary.json');
          assert.equal(e.applicationHead,'d4f4baa8e2016f4c9107b40176388bf2d3f6fe8c');
          assert.equal((await readFile(resolve(dir,'source-tree.txt'),'utf8')).trim(),'8754910f55ac44dd430cd5601d789c0d84d40e35');
          assert.equal(e.workflowHead,(await readFile(resolve(dir,'workflow-trigger-head.txt'),'utf8')).trim());
          assert.equal(e.arm.checked,process.env.VITE_BRIDGE_BALUSTRADE_PREVIEW==='1');
          assert.equal(s.collectionComplete,true);
          assert.equal(s.coversNativeWindow,true);
          assert.equal(s.originalHarnessPassed,false);
          assert(e.scripts.length>0);
          const manifest=(await readFile(resolve(dir,'diagnostic-dist.sha256'),'utf8')).split('\n');
          const receipts=[],maps=new Map();
          for(const script of e.scripts){
            const result={relativePath:script.relativePath,recordedSha256:script.sha256,qualified:false};
            try{
              const rel=script.relativePath;
              for(const base of [resolve('dist'),resolve(process.env.RUNNER_TEMP,'normal-dist')])assert(resolve(base,rel).startsWith(base+'/'));
              assert.equal(script.file,'script-'+script.sha256+'.js');
              const captured=await readFile(resolve(dir,script.file));
              assert.equal(captured.length,script.bytes);
              assert.equal(sha(captured),script.sha256);
              assert(manifest.includes(script.sha256+'  ./'+rel),'Capture manifest mismatch');
              const normal=await readFile(resolve(process.env.RUNNER_TEMP,'normal-dist',rel));
              const mapped=await readFile(resolve('dist',rel));
              result.normalSha256=sha(normal);result.mappedSha256=sha(mapped);
              assert(normal.equals(captured),'Normal rebuild differs from captured JS');
              assert(mapped.equals(captured),'Hidden-map rebuild differs from captured JS');
              const raw=await readFile(resolve('dist',rel+'.map'));
              const data=JSON.parse(raw);
              assert.equal(data.version,3);
              assert(Array.isArray(data.sources)&&data.sources.length>0);
              assert.equal(data.sources.length,data.sourcesContent.length);
              if(data.file)assert.equal(basename(data.file),basename(rel));
              const target=resolve(out,'maps',rel+'.map');
              assert(target.startsWith(resolve(out,'maps')+'/'));
              await mkdir(dirname(target),{recursive:true});await copyFile(resolve('dist',rel+'.map'),target);
              maps.set(script.url,new SourceMap(data));result.mapSha256=sha(raw);result.qualified=true;
            }catch(error){result.error=String(error);}
            receipts.push(result);
          }
          const allQualified=receipts.every(x=>x.qualified);
          await writeFile(resolve(out,'qualification.json'),JSON.stringify({diagnosticOnly:true,releaseAcceptance:false,applicationHead:e.applicationHead,originalWorkflowHead:e.workflowHead,bridge:process.env.VITE_BRIDGE_BALUSTRADE_PREVIEW,allQualified,receipts},null,2)+'\n');
          assert(allQualified,'Not all recorded JavaScript matched byte-for-byte; no source locations published');
          const counts=new Map();
          let t=p.startTime;
          for(let i=0;i<p.samples.length;i++){t+=p.timeDeltas[i];if(t>=s.nativeStartUs&&t<=s.nativeEndUs)counts.set(p.samples[i],(counts.get(p.samples[i])??0)+1);}
          const nodes=p.nodes.map(n=>{
            const f=n.callFrame,map=maps.get(f.url);
            const entry=map&&f.lineNumber>=0&&f.columnNumber>=0?map.findEntry(f.lineNumber,f.columnNumber):null;
            return {id:n.id,callFrame:f,selfSamples:counts.get(n.id)??0,original:entry?.originalSource?entry:null};
          });
          assert(nodes.some(n=>n.original&&n.selfSamples>0),'No native-window sampled nodes resolved');
          await writeFile(resolve(out,'mapped-nodes.json'),JSON.stringify({nativeStartUs:s.nativeStartUs,nativeEndUs:s.nativeEndUs,nodes},null,2)+'\n');
          console.log(JSON.stringify(nodes.filter(n=>n.original).sort((a,b)=>b.selfSamples-a.selfSamples).slice(0,30),null,2));
          JS
          node --check "$RUNNER_TEMP/qualify.mjs"
          cp "$RUNNER_TEMP/qualify.mjs" "$RUNNER_TEMP/map-evidence/"
          node "$RUNNER_TEMP/qualify.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-map-qualification-bridge-${{ matrix.bridge }}-NOT-RELEASE
          path: ${{ runner.temp }}/map-evidence
          if-no-files-found: warn
          retention-days: 14
