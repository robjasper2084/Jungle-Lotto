name: Greater Detroit geographic world seam math

on:
  pull_request:
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/greater-detroit-world/**'
      - '.github/workflows/gds-world-seams.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seam-tests:
    name: guarded-portal-transform-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pure geographic and physical-gate regression
        working-directory: lottominded-ultra.io/games/gothtechnology2/greater-detroit-world
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Typecheck source without external dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2/greater-detroit-world
        run: tsc --noEmit -p tsconfig.json
