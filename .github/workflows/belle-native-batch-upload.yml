name: Belle native batch upload experiment

on:
  push:
    branches: [upgrade-redesign-native-batch-20261124]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-native-batch-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_PARENT_SHA: 9e02a7f8015a8d4b3e8ceee28eed13aa6c140688
  INTEGRATED_MAIN_SHA: 2a8901996e53b1f93474f3c2165e078b6dd16e57
  GAME_PATH: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
  STRICT_SCRIPT_SHA256: 8f6af949083800c491b65e0709c04cc29eb5712634f744c5b912f76ce651fcf5

jobs:
  strict-native:
    name: Verify native batch equivalence and unchanged full-scene budgets
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check test and build the exact experiment source
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          node --check scripts/sustained-ride-profile.mjs
          node --check scripts/render-batched-upload-equivalence.mjs
          npm run build
      - name: Retain exact product source and immutable build identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFile,readdir,writeFile,mkdir} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          const game=resolve(process.env.GAME_PATH),out=resolve('native-batch-evidence'),hash=b=>createHash('sha256').update(b).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const commit=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),parent=git('rev-parse','HEAD^');
          assert.equal(commit,process.env.GITHUB_SHA);assert.equal(parent,process.env.PRODUCT_PARENT_SHA);
          execFileSync('git',['merge-base','--is-ancestor',process.env.INTEGRATED_MAIN_SHA,'HEAD']);
          const expectedExtras=['.github/workflows/belle-native-batch-upload.yml',process.env.GAME_PATH+'/scripts/render-batched-upload-equivalence.mjs'].sort();
          assert.deepEqual(git('diff','--name-only',parent,'HEAD').split('\n').filter(Boolean).sort(),expectedExtras);
          const sourceFiles=['package.json','package-lock.json','../../package.json','../../package-lock.json','vite.config.ts','tsconfig.json'];
          async function sourceWalk(dir){for(const entry of await readdir(dir,{withFileTypes:true})){
            const path=resolve(dir,entry.name);if(entry.isDirectory())await sourceWalk(path);else if(entry.isFile()&&/\.(?:ts|mjs|js)$/.test(entry.name))sourceFiles.push(relative(game,path).split(sep).join('/'));
          }}for(const directory of ['src','runtime','scripts','../tools'])await sourceWalk(resolve(game,directory));sourceFiles.sort();
          const sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>{
            const bytes=await readFile(resolve(game,path)),repoPath=relative(resolve('.'),resolve(game,path)).split(sep).join('/');
            assert(!repoPath.startsWith('../'),'Source must belong to this checkout');
            const committed=execFileSync('git',['show','HEAD:'+repoPath]);assert.equal(hash(bytes),hash(committed),'Source differs from committed bytes: '+path);
            return [path,hash(bytes)];
          })));
          assert.equal(sources['scripts/sustained-ride-profile.mjs'],process.env.STRICT_SCRIPT_SHA256);
          const mainStrict=execFileSync('git',['show',process.env.INTEGRATED_MAIN_SHA+':'+process.env.GAME_PATH+'/scripts/sustained-ride-profile.mjs']);
          assert.equal(hash(mainStrict),process.env.STRICT_SCRIPT_SHA256,'Retain main GPS additions and original riding thresholds unchanged');
          const files=[];async function walk(dir){for(const entry of await readdir(dir,{withFileTypes:true})){
            const path=resolve(dir,entry.name);if(entry.isDirectory())await walk(path);else{assert(entry.isFile());const bytes=await readFile(path);files.push({path:relative(resolve(game,'dist'),path).split(sep).join('/'),bytes:bytes.length,sha256:hash(bytes)});}
          }}await walk(resolve(game,'dist'));files.sort((a,b)=>a.path.localeCompare(b.path));
          const metadata={version:1,repository:'robjasper2084/Jungle-Lotto',commit,tree,parent,integratedMainCommit:process.env.INTEGRATED_MAIN_SHA,
            buildId:'native-batch-'+process.env.GITHUB_RUN_ID+'-'+commit,builtAt:new Date().toISOString(),node:process.version,sources,files,
            scope:'Guarded identical BatchedMesh indirect dirty-mark experiment. The native fixture verifies controlled pixels and commands; separate full-scene desktop and phone captures retain the unchanged strict script from integrated main. No fixture result substitutes for release checks.'};
          await mkdir(out,{recursive:true});await writeFile(resolve(out,'source-integrity.json'),JSON.stringify(metadata,null,2)+'\n');
          console.log('BELLE_NATIVE_BATCH_BUILD '+JSON.stringify({commit,tree,parent,buildId:metadata.buildId,files:files.length,sourceFiles:sourceFiles.length,strictScriptSha256:sources['scripts/sustained-ride-profile.mjs']}));
          NODE
      - name: Install the pinned browser driver and Chrome
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install chrome
      - name: Verify native pixels commands and real upload suppression
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_BATCH_OUTPUT: output/batched-upload-equivalence
        run: node scripts/render-batched-upload-equivalence.mjs
      - name: Retain the complete native equivalence evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,cpSync,mkdirSync} from 'node:fs';
          import {resolve} from 'node:path';
          mkdirSync('native-batch-evidence',{recursive:true});
          const source=resolve(process.env.GAME_PATH,'output/batched-upload-equivalence');
          if(existsSync(source))cpSync(source,resolve('native-batch-evidence/equivalence'),{recursive:true});
          NODE
      - name: Run both unchanged strict full-scene captures and retain original outcomes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {readFileSync,writeFileSync,cpSync,existsSync} from 'node:fs';
          import {resolve} from 'node:path';
          const game=resolve(process.env.GAME_PATH),receipts=[];
          const fixture=JSON.parse(readFileSync('native-batch-evidence/equivalence/report.json','utf8'));
          assert.equal(fixture.passed,true,'Native equivalence must pass before riding');
          const browserPacing=value=>value?.installed===true&&value.mode==='browser'&&value.submittedCallbacks===0&&value.pendingFenceSkippedCallbacks===0&&
            ['capacity','pendingCallbacks','completedCallbacks','peakPendingCallbacks'].every(key=>value[key]===null);
          const batchTreatment=(start,finish)=>{
            const keys=['attempted','delegated','suppressed','fallback','externalMarks','invalidations'];
            const integer=value=>Number.isSafeInteger(value)&&value>=0;
            const inspect=value=>{
              if(value?.version!==1||!integer(value.installedBatches)||!integer(value.activeBatches)||
                !Array.isArray(value.batches)||value.batches.length!==value.installedBatches||!value.totals)return null;
              const ids=new Set(),totals=Object.fromEntries(keys.map(key=>[key,0]));let active=0;
              for(const row of value.batches){
                const stats=row?.stats;
                if(!integer(row?.objectId)||ids.has(row.objectId)||typeof row.name!=='string'||stats?.supported!==true||
                  typeof stats.active!=='boolean'||!(stats.disabledReason===null||typeof stats.disabledReason==='string')||
                  !keys.every(key=>integer(stats[key]))||stats.attempted!==stats.delegated+stats.suppressed||stats.fallback>stats.delegated)return null;
                ids.add(row.objectId);if(stats.active)active++;for(const key of keys)totals[key]+=stats[key];
              }
              if(active!==value.activeBatches||!keys.every(key=>integer(value.totals[key])&&value.totals[key]===totals[key]))return null;
              return new Map(value.batches.map(row=>[row.objectId,row.stats]));
            };
            try{
              const before=inspect(start),after=inspect(finish);
              if(!before||!after||!start.activeBatches||!finish.activeBatches)return {valid:false,reason:'Missing or malformed active adapter observations'};
              const delta=Object.fromEntries(keys.map(key=>[key,0]));let matchingBatches=0;
              for(const [id,stats] of after){const previous=before.get(id);if(!previous)continue;matchingBatches++;
                if(!keys.every(key=>stats[key]>=previous[key]))return {valid:false,reason:'Lifetime counters decreased for a matched batch',objectId:id};
                for(const key of keys)delta[key]+=stats[key]-previous[key];
              }
              return {valid:matchingBatches>0&&delta.attempted>0&&delta.suppressed>0,matchingBatches,delta,
                meaning:'Setter decisions for matched scene batches at capture boundaries; not uploads, GPU work or completions'};
            }catch(error){return {valid:false,reason:String(error)};}
          };
          for(const device of ['desktop','phone']){
            const child=spawnSync(process.execPath,['scripts/sustained-ride-profile.mjs'],{cwd:game,stdio:'inherit',
              env:{...process.env,BELLE_PROFILE_DEVICE:device,BELLE_PROFILE_MODE:'full',BELLE_PROFILE_SECONDS:'90'}});
            const output=resolve(game,'output/sustained-profile/full',device);let report=null,readError=null;
            try{report=JSON.parse(readFileSync(resolve(output,'report.json'),'utf8'));}catch(error){readError=String(error);}
            if(existsSync(output))cpSync(output,resolve('native-batch-evidence',device),{recursive:true});
            const pacing=report?.profile?.gpuFramePacing;
            const identityValid=report?.sourceHead===process.env.GITHUB_SHA&&report?.device===device&&report?.mode==='full'&&report?.requestedSeconds===90;
            const pacingValid=browserPacing(pacing?.atStart)&&browserPacing(pacing?.atFinish)&&pacing.atFinish.renderedCallbacks>pacing.atStart.renderedCallbacks;
            const batchEvidence=batchTreatment(report?.profile?.settingsAtStart?.batchIndirectUpdates,report?.profile?.settings?.batchIndirectUpdates),batchValid=batchEvidence.valid;
            receipts.push({device,status:child.status,signal:child.signal,error:child.error?String(child.error):null,readError,
              source:report?.sourceHead,identityValid,pacingValid,batchValid,batchEvidence,passed:report?.passed,frameQualityAccepted:report?.frameQualityAccepted,
              baselinePassed:report?.baselinePassed,gpsPassed:report?.gpsRegression?.passed,
              gps:{nativeBrowserChecksPassed:report?.gpsRegression?.nativeBrowserChecks?.passed,sensorSource:report?.gpsRegression?.sensorSource,
                syntheticSensors:report?.gpsRegression?.syntheticSensors,physicalDeviceCertified:report?.gpsRegression?.physicalDeviceCertified,
                states:report?.gpsRegression?.states,errors:report?.gpsRegression?.errors,cleanupErrors:report?.gpsRegression?.cleanupErrors},
              frames:report?.profile?.frames,frameMs:report?.profile?.metrics?.frameMs,over250ms:report?.profile?.over250ms,
              actualGpu:report?.actualGpu,pacing:report?.profile?.gpuFramePacing,
              batchAtStart:report?.profile?.settingsAtStart?.batchIndirectUpdates,batchAtFinish:report?.profile?.settings?.batchIndirectUpdates,
              errors:report?.errors,failedRequests:report?.failedRequests,probeErrors:report?.probeErrors});
            writeFileSync('native-batch-evidence/results.json',JSON.stringify({version:1,source:process.env.GITHUB_SHA,receipts},null,2)+'\n');
          }
          console.log('BELLE_NATIVE_BATCH_RESULTS '+JSON.stringify(receipts));
          process.exit(receipts.every(row=>row.status===0&&row.identityValid===true&&row.pacingValid===true&&row.batchValid===true&&row.baselinePassed===true&&row.gpsPassed===true&&row.passed===true&&row.frameQualityAccepted===true)?0:1);
          NODE
      - name: Verify source and build remained unchanged
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const game=resolve(process.env.GAME_PATH),hash=b=>createHash('sha256').update(b).digest('hex');
          const original=JSON.parse(await readFile('native-batch-evidence/source-integrity.json','utf8'));
          const sources=Object.fromEntries(await Promise.all(Object.keys(original.sources).map(async path=>[path,hash(await readFile(resolve(game,path)))])));
          assert.deepEqual(sources,original.sources);
          for(const file of original.files){const bytes=await readFile(resolve(game,'dist',file.path));assert.equal(bytes.length,file.bytes,file.path);assert.equal(hash(bytes),file.sha256,file.path);}
          await writeFile('native-batch-evidence/source-integrity-after.json',JSON.stringify({commit:original.commit,sourceFiles:Object.keys(sources).length,builtFiles:original.files.length,verifiedAt:new Date().toISOString(),unchanged:true},null,2)+'\n');
          NODE
      - name: Preserve all evidence including failed numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-native-batch-upload-${{ github.sha }}
          path: native-batch-evidence/
          if-no-files-found: warn
          retention-days: 14
