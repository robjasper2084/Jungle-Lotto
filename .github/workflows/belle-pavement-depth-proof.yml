name: Belle Isle isolated pavement depth equivalence

on:
  pull_request:
    paths:
      - '.github/workflows/belle-pavement-depth-proof.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belle-pavement-depth-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  PAVEMENT_DEPTH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  pixels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PAVEMENT_DEPTH_SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.github/workflows/belle-pavement-depth-proof.yml
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/
            /lottominded-ultra.io/games/gothtechnology2/swoop-source/src/detroit/electricVehicles.ts
            /lottominded-ultra.io/games/gothtechnology2/greater-detroit-world/src/connectionMath.ts
            /lottominded-ultra.io/games/gothtechnology2/greater-detroit-graphics/src/visualStandard.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing locked game and browser dependencies
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          test "$(git rev-parse HEAD)" = "$PAVEMENT_DEPTH_SOURCE_SHA"
          npm ci
          npx playwright install --with-deps chrome
          cd belle-isle-source/game
          npm ci
      - name: Verify geometry ownership, native range and proof guards
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          node --experimental-strip-types --test src/belle/pavementDepthPrepass.test.ts src/belle/groundDrawRange.test.ts src/belle/pavement.test.ts
          node --test scripts/pavement-depth-proof-contract.test.mjs
          node node_modules/typescript/bin/tsc -p tsconfig.pavement-proof.json --noEmit --pretty false
          node scripts/pavement-depth-native-proof.mjs --compile-only
          git diff --exit-code HEAD
      - name: Capture exact paired native pixels and extra depth submissions
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: node scripts/pavement-depth-native-proof.mjs
      - name: Preserve all raw pairs, controls and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-pavement-depth-pixels-NOT-ACCEPTANCE-${{ matrix.os }}-${{ env.PAVEMENT_DEPTH_SOURCE_SHA }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/pavement-depth-proof/
          if-no-files-found: error
          retention-days: 14
