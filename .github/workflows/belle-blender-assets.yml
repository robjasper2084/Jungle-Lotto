name: Belle Blender asset preflight

on:
  pull_request:
    paths:
      - '.github/workflows/belle-blender-assets.yml'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/tools/export-belle-environment.py'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/tools/validate-belle-asset-pack.mjs'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/tools/validate-belle-asset-pack.test.mjs'
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Blender exporter syntax (does not execute Blender)
        run: python3 -m py_compile lottominded-ultra.io/games/gothtechnology2/belle-isle-source/tools/export-belle-environment.py
      - name: Test GLB preflight gates
        run: node --test lottominded-ultra.io/games/gothtechnology2/belle-isle-source/tools/validate-belle-asset-pack.test.mjs
