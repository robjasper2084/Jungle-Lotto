name: JARVS avionics isolated verification

on:
  push:
    branches: [feature/jarvs-avionics]
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/**'
      - '.github/workflows/jarvs-avionics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvs-avionics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avionics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/package-lock.json
      - name: Install pinned Belle Isle dependencies
        run: npm ci
      - name: JARVS deterministic sensor and bounded-memory tests
        run: node --experimental-strip-types --test src/belle/jarvsAvionics.test.ts
      - name: Strict TypeScript check
        run: npm run check
      - name: All registered Belle Isle regressions
        run: npm test
      - name: Build the real Belle Isle Explorer
        run: npm run build
