name: Cadillac same-host ABBA diagnostic (not release acceptance)
on:
  pull_request:
    branches: [upgrade-redesign-cadillac-modification-suite]
    paths: ['.github/workflows/belle-cadillac-same-host-diagnostic.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: A, source: '79eac611ac17b3b1b30ea3eca670aefdeb2acdfb', tree: 'b42c1fbd6eee6327abb0b5fcd09a0401a33ba2c5'}
          - {label: B, source: '96603a2346364262324569bb5839a07cea3a3eaa', tree: '22b3c7cacd9d9af684489519895c3f260d16efca'}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned checkout and build with original checks
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          npm ci
          npm run check
          npm test
          node --check scripts/sustained-ride-profile.mjs
          npm run build
          mkdir -p "$RUNNER_TEMP/receipt"
          git rev-parse HEAD > "$RUNNER_TEMP/receipt/source.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/receipt/tree.txt"
          git hash-object scripts/sustained-ride-profile.mjs > "$RUNNER_TEMP/receipt/driver.txt"
          test "$(cat "$RUNNER_TEMP/receipt/driver.txt")" = c722b5810a7693e5ece72ed00b4401e7cde7267a
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/receipt/dist.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.label }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.label }}
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: error
          retention-days: 14
  native-comparison:
    needs: build
    runs-on: macos-15
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79eac611ac17b3b1b30ea3eca670aefdeb2acdfb
          path: A
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/checkout@v4
        with:
          ref: 96603a2346364262324569bb5839a07cea3a3eaa
          path: B
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lottominded-ultra.io/games/gothtechnology2/package*.json
            /lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: game-A
          path: A/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist
      - uses: actions/download-artifact@v4
        with:
          name: receipt-A
          path: evidence/receipt-A
      - uses: actions/download-artifact@v4
        with:
          name: game-B
          path: B/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist
      - uses: actions/download-artifact@v4
        with:
          name: receipt-B
          path: evidence/receipt-B
      - name: Install pinned browser dependencies and verify both build inventories
        run: |
          (cd A/lottominded-ultra.io/games/gothtechnology2 && npm ci && npx playwright install chrome)
          (cd B/lottominded-ultra.io/games/gothtechnology2 && npm ci)
          cmp A/lottominded-ultra.io/games/gothtechnology2/package-lock.json B/lottominded-ultra.io/games/gothtechnology2/package-lock.json
          diff -qr A/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts B/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts > evidence/script-differences.txt || test "$?" = 1
          for label in A B; do
            test "$(git -C "$label" rev-parse HEAD)" = "$(cat "evidence/receipt-$label/source.txt")"
            test "$(git -C "$label" rev-parse 'HEAD^{tree}')" = "$(cat "evidence/receipt-$label/tree.txt")"
            test "$(git -C "$label" hash-object 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/sustained-ride-profile.mjs')" = c722b5810a7693e5ece72ed00b4401e7cde7267a
            (cd "$label/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist" && shasum -a 256 -c "$GITHUB_WORKSPACE/evidence/receipt-$label/dist.sha256")
            test "$(find "$label/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/dist" -type f | wc -l | tr -d ' ')" = "$(wc -l < "evidence/receipt-$label/dist.sha256" | tr -d ' ')"
          done
          printf 'ABBA diagnostic only; no release acceptance\n' > evidence/scope.txt
          { sw_vers; uname -m; sysctl hw.model hw.ncpu hw.memsize; node -v; "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version; } > evidence/host.txt
      - name: Original full High desktop 90s - 1 A
        timeout-minutes: 28
        working-directory: A/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          target="$GITHUB_WORKSPACE/evidence/1-A"
          mkdir -p "$target"
          test ! -e output/sustained-profile/full/desktop
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(cat "$GITHUB_WORKSPACE/evidence/receipt-A/source.txt")"
          { date -u; uptime; vm_stat; } > "$target/host-before.txt"
          status=0
          node scripts/sustained-ride-profile.mjs > "$target/original.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$target/exit-code.txt"
          cat "$target/original.log"
          { date -u; uptime; vm_stat; } > "$target/host-after.txt"
          if test -d output/sustained-profile/full/desktop; then
            mv output/sustained-profile/full/desktop "$target/report"
          fi
          (cd dist && shasum -a 256 -c "$GITHUB_WORKSPACE/evidence/receipt-A/dist.sha256") > "$target/post-build-integrity.txt"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "$(wc -l < "$GITHUB_WORKSPACE/evidence/receipt-A/dist.sha256" | tr -d ' ')"
          test -s "$target/report/report.json"
      - name: Original full High desktop 90s - 2 B
        timeout-minutes: 28
        working-directory: B/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          target="$GITHUB_WORKSPACE/evidence/2-B"
          mkdir -p "$target"
          test ! -e output/sustained-profile/full/desktop
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(cat "$GITHUB_WORKSPACE/evidence/receipt-B/source.txt")"
          { date -u; uptime; vm_stat; } > "$target/host-before.txt"
          status=0
          node scripts/sustained-ride-profile.mjs > "$target/original.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$target/exit-code.txt"
          cat "$target/original.log"
          { date -u; uptime; vm_stat; } > "$target/host-after.txt"
          if test -d output/sustained-profile/full/desktop; then
            mv output/sustained-profile/full/desktop "$target/report"
          fi
          (cd dist && shasum -a 256 -c "$GITHUB_WORKSPACE/evidence/receipt-B/dist.sha256") > "$target/post-build-integrity.txt"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "$(wc -l < "$GITHUB_WORKSPACE/evidence/receipt-B/dist.sha256" | tr -d ' ')"
          test -s "$target/report/report.json"
      - name: Original full High desktop 90s - 3 B
        timeout-minutes: 28
        working-directory: B/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          target="$GITHUB_WORKSPACE/evidence/3-B"
          mkdir -p "$target"
          test ! -e output/sustained-profile/full/desktop
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(cat "$GITHUB_WORKSPACE/evidence/receipt-B/source.txt")"
          { date -u; uptime; vm_stat; } > "$target/host-before.txt"
          status=0
          node scripts/sustained-ride-profile.mjs > "$target/original.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$target/exit-code.txt"
          cat "$target/original.log"
          { date -u; uptime; vm_stat; } > "$target/host-after.txt"
          if test -d output/sustained-profile/full/desktop; then
            mv output/sustained-profile/full/desktop "$target/report"
          fi
          (cd dist && shasum -a 256 -c "$GITHUB_WORKSPACE/evidence/receipt-B/dist.sha256") > "$target/post-build-integrity.txt"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "$(wc -l < "$GITHUB_WORKSPACE/evidence/receipt-B/dist.sha256" | tr -d ' ')"
          test -s "$target/report/report.json"
      - name: Original full High desktop 90s - 4 A
        timeout-minutes: 28
        working-directory: A/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_PROFILE_DEVICE: desktop
          BELLE_PROFILE_MODE: full
          BELLE_PROFILE_SECONDS: '90'
        run: |
          target="$GITHUB_WORKSPACE/evidence/4-A"
          mkdir -p "$target"
          test ! -e output/sustained-profile/full/desktop
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(cat "$GITHUB_WORKSPACE/evidence/receipt-A/source.txt")"
          { date -u; uptime; vm_stat; } > "$target/host-before.txt"
          status=0
          node scripts/sustained-ride-profile.mjs > "$target/original.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$target/exit-code.txt"
          cat "$target/original.log"
          { date -u; uptime; vm_stat; } > "$target/host-after.txt"
          if test -d output/sustained-profile/full/desktop; then
            mv output/sustained-profile/full/desktop "$target/report"
          fi
          (cd dist && shasum -a 256 -c "$GITHUB_WORKSPACE/evidence/receipt-A/dist.sha256") > "$target/post-build-integrity.txt"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "$(wc -l < "$GITHUB_WORKSPACE/evidence/receipt-A/dist.sha256" | tr -d ' ')"
          test -s "$target/report/report.json"
      - name: Confirm all four original reports are present
        if: always()
        run: |
          for lane in 1-A 2-B 3-B 4-A; do
            test -s "evidence/$lane/report/report.json"
            test -s "evidence/$lane/exit-code.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadillac-same-host-abba-diagnostic-not-release
          path: evidence/
          if-no-files-found: error
          retention-days: 14
