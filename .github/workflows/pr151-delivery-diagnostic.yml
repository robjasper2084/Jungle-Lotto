name: PR151 supplemental actual-loader delivery evidence
on:
  push:
    branches: [diagnostics/pr151-delivery-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [desktop, phone]
    steps:
      - name: Reserve checkout disk
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          sparse-checkout: .diagnostics
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: work
          ref: 279af528be739ce3f348093b30eff8d1f6dd354b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate observer and instrument an isolated copy only
        run: |
          node --test diagnostic/.diagnostics/pr151-delivery.test.mjs
          python diagnostic/.diagnostics/pr151-instrument.py
          node --check work/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/scripts/pr151-polish-delivery-observed.mjs
      - name: Build exact unchanged release candidate
        working-directory: work/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm run build
      - name: Install existing browser runtime
        working-directory: work/lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Observe original native-input scenario with unchanged assertions and deadlines
        timeout-minutes: 40
        working-directory: work/lottominded-ultra.io/games/gothtechnology2
        env:
          BELLE_POLISH_BROWSER_HEADED: '1'
          BELLE_POLISH_BROWSER_CASE: ${{ matrix.case }}
          GITHUB_SHA: 279af528be739ce3f348093b30eff8d1f6dd354b
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" node belle-isle-source/game/scripts/pr151-polish-delivery-observed.mjs
      - name: Confirm no tracked release source changed
        if: always()
        run: git -C work diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr151-delivery-${{ matrix.case }}-${{ github.run_id }}
          path: |
            work/pr151-delivery-provenance.json
            work/lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/polish-browser/
          if-no-files-found: error
          retention-days: 14
