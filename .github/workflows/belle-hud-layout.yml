name: Belle Isle HUD layout acceptance
on:
  pull_request:
    paths:
      - 'lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/**'
      - '.github/workflows/belle-hud-layout.yml'
permissions:
  contents: read
concurrency:
  group: belle-hud-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hud-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        case: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strict check, complete registered suite and real game build
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          node --check scripts/hud-layout-browser-smoke.mjs
      - name: Install existing browser runtime
        working-directory: lottominded-ultra.io/games/gothtechnology2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise the real HUD editor and independent native touch
        timeout-minutes: 40
        working-directory: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game
        env:
          BELLE_HUD_CASE: ${{ matrix.case }}
          HUD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" node scripts/hud-layout-browser-smoke.mjs
      - name: Preserve exact-candidate evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belle-hud-layout-${{ matrix.case }}
          path: lottominded-ultra.io/games/gothtechnology2/belle-isle-source/game/output/hud-layout
          if-no-files-found: error
          retention-days: 14
